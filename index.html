<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>단어 — Koreyscha so'z kartalari</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --paper:#fffdf9; --ink:#1f1c19; --muted:#7b736a; --line:#e6ded2;
  --red:#b93a26; --red-soft:#f6e3dc; --blue:#1f4e79; --blue-soft:#e1ebf4;
  --green:#2f7d4f; --green-soft:#e0f0e6; --amber:#b7791f; --amber-soft:#f8ecd6;
  --r:16px; --shadow:0 1px 2px rgba(40,30,20,.06),0 8px 28px rgba(40,30,20,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.ko{font-family:"Noto Sans KR",sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--red);font-family:"Noto Sans KR";font-weight:900;margin-right:6px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:6px;align-items:center}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5px 10px;text-align:right;min-width:62px}
.stat b{display:block;font-size:17px;line-height:1.1}
.stat small{color:var(--muted);font-size:10.5px}
.gear{border:1px solid var(--line);background:var(--paper);border-radius:12px;width:44px;height:44px;font-size:19px;position:relative;flex:none}
.cdot{position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--paper)}
.cdot.ok{background:var(--green)}.cdot.need{background:var(--amber)}.cdot.err{background:var(--red)}
@media (max-width:420px){.stat{min-width:0;padding:5px 8px}.brand p{display:none}}
nav.tabs{display:flex;gap:4px;background:#ebe4d9;padding:4px;border-radius:14px;margin-bottom:12px;position:sticky;top:6px;z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;font-weight:700;color:#5d564e;font-size:14px}
nav.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.folders{display:flex;gap:6px;margin-bottom:14px;align-items:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:#4b453f;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.6;font-weight:500}
.chip.add{border-style:dashed;color:var(--muted)}
.chip input{border:0;outline:0;background:transparent;width:110px;font-size:13px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;outline:none;transition:border .15s}
.field:focus{border-color:var(--blue)}
textarea.field{resize:vertical;min-height:54px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:15px;flex:none}
.status{font-size:13px;margin-top:10px;min-height:18px}
.status.err{color:var(--red)}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{background:var(--amber-soft);color:#7a5414;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.hidden{display:none!important}
.switch{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch i{width:38px;height:22px;border-radius:99px;background:#d8cfc2;position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{left:19px}

/* add */
.add-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.photo-chip{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:12px;padding:8px 10px;margin-top:10px;font-size:13px;color:var(--blue)}
.photo-chip img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.opts-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}

/* drafts */
.drafts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.drafts-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.draft{display:grid;grid-template-columns:28px 120px 1fr;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.draft.off{opacity:.55}
@media (max-width:560px){.draft{grid-template-columns:24px 92px 1fr;gap:10px;padding:10px}}
.draft .ck input{width:20px;height:20px;accent-color:var(--red);margin-top:4px}
.pic{width:100%;aspect-ratio:1;border-radius:12px;background:#f2ede5;display:grid;place-items:center;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .emo{font-size:44px}
.pic .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.dk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dk .w{font-family:"Noto Sans KR";font-weight:700;font-size:22px}
.dk .r{color:var(--muted);font-size:13px}
.d-uz{margin-top:6px;padding:7px 10px;border-radius:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin:6px 4px 0 0}
.tag.h{background:var(--amber-soft);color:var(--amber)}
.tag.dup{background:var(--red-soft);color:var(--red)}
.mini-ex{font-size:12.5px;color:#5a534b;margin-top:6px;line-height:1.45}
.mini-ex .k{font-family:"Noto Sans KR";color:var(--ink)}
.img-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.strip button{flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:#f2ede5}
.strip button.on{border-color:var(--red)}
.strip img{width:100%;height:100%;object-fit:cover}
.strip .q{display:flex;gap:6px;margin-top:6px}

/* card faces */
.word-ko{font-family:"Noto Sans KR";font-weight:700;font-size:32px;line-height:1.15}
.roman{color:var(--muted);font-size:14px}
.word-uz{font-size:19px;font-weight:700}
.note{font-size:13.5px;color:#4f4942;background:#faf6ef;border-radius:10px;padding:8px 10px;margin-top:10px}
.ex{border-top:1px solid var(--line);padding:10px 0 2px;display:flex;gap:10px;align-items:flex-start}
.ex .t{flex:1}
.ex .k{font-family:"Noto Sans KR";font-size:15.5px;font-weight:500}
.ex .r{font-size:12px;color:var(--muted)}
.ex .u{font-size:13.5px;color:#4f4942;margin-top:1px}
.sec-t{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:14px 0 2px}
.review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.bar{height:5px;background:#e8e0d4;border-radius:9px;overflow:hidden;flex:1;margin:0 12px}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.flip{perspective:1400px;cursor:pointer;max-width:520px;margin:0 auto}
.flip .inner{position:relative;height:min(560px,64vh);transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.front .big-ko{font-family:"Noto Sans KR";font-weight:700;font-size:54px;line-height:1.1}
.front .big-uz{font-size:32px;font-weight:800;letter-spacing:-.02em}
.front .dir{position:absolute;top:16px;left:18px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.front .tap{position:absolute;bottom:18px;font-size:12.5px;color:var(--muted)}
.back{transform:rotateY(180deg);overflow-y:auto}
.back .pic{aspect-ratio:16/10;margin-bottom:12px}
.back .pic img{object-fit:cover}
.grades{max-width:520px;margin:14px auto 0}
.grades p{text-align:center;margin:0 0 10px;font-weight:700}
.grades .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades button{border:1px solid var(--line);border-radius:14px;padding:10px 2px;background:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13.5px}
.grades button small{font-weight:500;color:var(--muted);font-size:11px}
.grades .g0{color:var(--red)} .grades .g1{color:var(--amber)} .grades .g2{color:var(--blue)} .grades .g3{color:var(--green)}
.empty{text-align:center;padding:36px 16px}
.empty .e{font-size:44px}
.empty h3{margin:8px 0 4px}

/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:left;display:flex;flex-direction:column;gap:5px}
.tile .pic{aspect-ratio:4/3}
.tile .pic .emo{font-size:36px}
.tile .k{font-family:"Noto Sans KR";font-weight:700;font-size:18px}
.tile .u{font-size:13px;color:#4f4942;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px;background:#c9c0b3}
.dot.due{background:var(--red)} .dot.ok{background:var(--green)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,24,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.modal .box{background:var(--paper);border-radius:20px 20px 0 0;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));position:relative}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
.modal .x{position:absolute;top:12px;right:12px}
.set-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.set-sec h4{margin:0 0 8px;font-size:14px}
.steps{margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.6;color:#4f4942}
.steps a{color:var(--blue);font-weight:700}

/* practice */
.q-wrap{max-width:560px;margin:0 auto}
.q-card{text-align:center;padding:22px 16px}
.q-card .pic{max-width:240px;margin:0 auto 12px;aspect-ratio:4/3}
.optsq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.optsq button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-weight:600;font-size:15px}
.optsq button.right{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.optsq button.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.mode-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.mode-pick{grid-template-columns:1fr}}
.mode{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left}
.mode b{display:block;font-size:15px;margin:6px 0 2px}
.mode span{font-size:12.5px;color:var(--muted)}
.mode .i{font-size:22px}
.fb{margin-top:12px;font-weight:700;min-height:22px}
.fb.ok{color:var(--green)} .fb.no{color:var(--red)}
.credit{font-size:10.5px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><span>단어</span>So'z kartalari</h1>
      <p>Koreyscha so'zlarni yig'ing va mustahkamlang</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><small>so'z</small></div>
      <div class="stat"><b id="stDue" style="color:var(--red)">0</b><small>bugun</small></div>
      <button class="gear hidden" id="cloudBtn" title="Google bilan kirish">☁️</button>
      <button class="gear" id="openSettings" title="Sozlamalar">⚙️</button>
    </div>
  </header>

  <div id="notice" class="notice hidden"></div>

  <nav class="tabs">
    <button data-tab="add" class="on">Qo'shish</button>
    <button data-tab="review">Takrorlash</button>
    <button data-tab="practice">Mashq</button>
    <button data-tab="library">Lug'at</button>
  </nav>

  <div class="folders" id="folders"></div>

  <section id="tab-add">
    <div class="panel">
      <textarea id="inWord" class="field" rows="2" placeholder="Yangi so'z: 사과, olma yoki apple… Bir nechta so'zni vergul yoki yangi qator bilan ajrating."></textarea>
      <div id="photoChip" class="photo-chip hidden">
        <img id="photoThumb" alt="">
        <div style="flex:1" id="photoText"></div>
        <button class="btn sm" id="clearPhoto">✕</button>
      </div>
      <div class="add-actions">
        <button class="btn" id="pickPhoto">📷 Rasm yuborish</button>
        <button class="btn primary" id="makeBtn">Karta yasash</button>
      </div>
      <input type="file" id="fileIn" accept="image/*" class="hidden">
      <div class="opts-row">
        <label class="switch"><input type="checkbox" id="autoImg"><i></i>Rasmni avtomatik topish</label>
        <div class="row" style="gap:6px"><span class="muted" style="font-size:13px">Papka:</span><select id="addFolder" class="field" style="width:auto;padding:7px 10px"></select></div>
      </div>
      <div class="status" id="addStatus"></div>
      <div id="draftsBox"></div>
    </div>
  </section>

  <section id="tab-review" class="hidden"></section>
  <section id="tab-practice" class="hidden"></section>
  <section id="tab-library" class="hidden">
    <input id="search" class="field" placeholder="Qidirish: koreyscha yoki o'zbekcha…">
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<input type="file" id="fileIn2" accept="image/*" class="hidden">
<input type="file" id="importIn" accept="application/json,.json" class="hidden">

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MIN=60e3, HOUR=3600e3, DAY=86400e3;

/* ================= storage (IndexedDB) ================= */
const idb = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open("danEo-cards", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("cards", {keyPath:"id"}); d.createObjectStore("kv"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    all: () => run("cards","readonly", s => s.getAll()),
    put: c => run("cards","readwrite", s => s.put(c)),
    putMany: list => run("cards","readwrite", s => { list.forEach(c => s.put(c)); return null; }),
    del: id => run("cards","readwrite", s => s.delete(id)),
    get: k => run("kv","readonly", s => s.get(k)),
    set: (k,v) => run("kv","readwrite", s => s.put(v,k)),
  };
})();
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("danEo."+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("danEo."+k, JSON.stringify(v)); }catch(e){} }
};

let cards = [], folders = [], curFolder = LS.get("folder","all"), tab = "add";
let photo = null;            // {blob, url}
let drafts = [];             // generated, not yet saved
const settings = { key: LS.get("key",""), model: LS.get("model",""), models: LS.get("models",[]), autoImg: LS.get("autoImg", true) };

function imgSig(img){ let h=5381; const t=img.slice(-400); for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return img.length.toString(36)+(h>>>0).toString(36); }
function stamp(c){
  c.mod = Date.now();
  if(c.img && c.img.startsWith("data:")){ const sg=imgSig(c.img); if(sg!==c.imgSig){ c.imgSig=sg; c.imgName=`img-${c.id}-${sg}.jpg`; } }
  else { c.imgSig=null; c.imgName=null; }
  return c;
}
async function persist(c){ stamp(c); await idb.put(c); scheduleSync(); }
async function persistMany(list){ list.forEach(stamp); await idb.putMany(list); scheduleSync(); }
async function removeCard(id){ const t=(await idb.get("deleted"))||{}; t[id]=Date.now(); await idb.set("deleted",t); await idb.del(id); cards=cards.filter(x=>x.id!==id); scheduleSync(); }
async function saveCard(c){ const i = cards.findIndex(x=>x.id===c.id); if(i>=0) cards[i]=c; else cards.push(c); await persist(c); }
async function saveFolders(changed){ if(changed) changed.mod=Date.now(); await idb.set("folders", folders); scheduleSync(); }
async function removeFolder(id){ const t=(await idb.get("fdeleted"))||{}; t[id]=Date.now(); await idb.set("fdeleted",t); folders=folders.filter(f=>f.id!==id); await saveFolders(); }

/* ================= helpers ================= */
function notice(m){ const n=$("#notice"); if(!m){n.classList.add("hidden");return;} n.innerHTML=m; n.classList.remove("hidden"); }
function status(m, err){ const s=$("#addStatus"); s.className="status"+(err?" err":""); s.innerHTML=m||""; }
function fmtIn(ms){
  if(ms<HOUR) return Math.max(1,Math.round(ms/MIN))+" daq";
  if(ms<DAY) return Math.round(ms/HOUR)+" soat";
  const d=ms/DAY; if(d<30) return Math.round(d)+" kun";
  if(d<365) return (Math.round(d/30*10)/10)+" oy";
  return (Math.round(d/365*10)/10)+" yil";
}
function isNew(c){ return !c.reps && !c.last; }
function dueLabel(c){ const diff=(c.due||0)-Date.now(); if(isNew(c)) return "yangi"; if(diff<=0) return "takrorlash vaqti"; return fmtIn(diff)+"dan keyin"; }
function folderName(id){ return (folders.find(f=>f.id===id)||{}).name || "—"; }
function inFolder(c){ return curFolder==="all" || c.folder===curFolder; }
function dueCards(){ const now=Date.now(); return cards.filter(c=>inFolder(c)&&(c.due||0)<=now); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function picHTML(c, loading){
  if(loading) return `<div class="pic"><span class="ld"><span class="spinner"></span></span></div>`;
  if(c.img) return `<div class="pic"><img src="${esc(c.img)}" alt="" loading="lazy" onerror="this.remove()"></div>`;
  return `<div class="pic"><span class="emo">${esc(c.emoji||"📘")}</span></div>`;
}

/* speech (brauzerning o'zida, bepul) */
let koVoice = null;
function pickVoice(){ const v = speechSynthesis.getVoices(); koVoice = v.find(x=>/^ko/i.test(x.lang)) || null; }
const canSpeak = "speechSynthesis" in window;
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t){
  if(!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang="ko-KR"; u.rate=.9; if(koVoice) u.voice=koVoice;
  speechSynthesis.speak(u);
}
const spk = t => canSpeak ? `<button class="iconbtn" data-say="${esc(t)}" title="Eshitish">🔊</button>` : "";
document.addEventListener("click", e => { const b=e.target.closest("[data-say]"); if(!b) return; e.stopPropagation(); speak(b.dataset.say); }, true);

/* ================= images ================= */
async function shrink(blob, max=480, q=.82){
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
const toDataURL = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
async function fileToCardImg(file){ return toDataURL(await shrink(file, 520, .8)); }
async function urlToCardImg(url){
  try{ const r = await fetch(url, {mode:"cors"}); if(!r.ok) throw 0; return await toDataURL(await shrink(await r.blob(), 520, .8)); }
  catch(e){ return url; } // CORS bo'lmasa, havolani o'zini saqlaymiz
}
const imgCache = new Map();
async function searchImages(q){
  q = String(q||"").trim(); if(!q) return [];
  if(imgCache.has(q)) return imgCache.get(q);
  const out = [];
  const ov = fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=10&mature=false`)
    .then(r=>r.ok?r.json():{results:[]})
    .then(j=>(j.results||[]).forEach(x=>{ if(x.thumbnail) out.push({thumb:x.thumbnail, src:x.thumbnail, credit:(x.creator?x.creator+" · ":"")+(x.license||"").toUpperCase()+" (Openverse)"}); }))
    .catch(()=>{});
  const wm = fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url|mime&iiurlwidth=480&format=json&origin=*`)
    .then(r=>r.ok?r.json():{})
    .then(j=>Object.values((j.query||{}).pages||{}).sort((a,b)=>(a.index||0)-(b.index||0)).forEach(p=>{
      const ii=(p.imageinfo||[])[0]; if(ii && /jpeg|png|webp/.test(ii.mime||"") && ii.thumburl) out.push({thumb:ii.thumburl, src:ii.thumburl, credit:"Wikimedia Commons"});
    }))
    .catch(()=>{});
  await Promise.all([ov, wm]);
  // Openverse natijalari oldin, keyin Wikimedia
  imgCache.set(q, out);
  return out;
}

/* ================= Gemini ================= */
const API = "https://generativelanguage.googleapis.com/v1beta";
function bumpCounter(){
  const d = new Date().toISOString().slice(0,10), c = LS.get("count",{d,n:0});
  const n = c.d===d ? c.n+1 : 1; LS.set("count",{d,n}); return n;
}
function todayCount(){ const d=new Date().toISOString().slice(0,10), c=LS.get("count",{d,n:0}); return c.d===d?c.n:0; }

async function listModels(key){
  const r = await fetch(`${API}/models?pageSize=200`, {headers:{"x-goog-api-key":key}});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw {status:r.status, message:(j.error&&j.error.message)||"Kalit ishlamadi"};
  const ok = (j.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes("generateContent"))
    .map(m => m.name.replace(/^models\//,""))
    .filter(n => /^gemini-/.test(n) && /flash/.test(n) && !/(image|tts|audio|live|embedding|thinking-exp|robotics|computer)/.test(n));
  const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
  const score = n => ver(n)*10 - (/lite/.test(n)?3:0) - (/preview|exp/.test(n)?1.5:0) - (/-\d{3}$|\d{2}-\d{2}/.test(n)?0.5:0);
  return [...new Set(ok)].sort((a,b)=>score(b)-score(a));
}
function modelOrder(){
  const list = settings.models.length ? settings.models : ["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-2.0-flash"];
  const first = settings.model && list.includes(settings.model) ? settings.model : list[0];
  return [first, ...list.filter(m=>m!==first)].slice(0,4);
}
async function gemini(parts){
  if(!settings.key) throw {code:"nokey"};
  let lastErr;
  for(const model of modelOrder()){
    const r = await fetch(`${API}/models/${encodeURIComponent(model)}:generateContent`, {
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":settings.key},
      body: JSON.stringify({contents:[{role:"user",parts}], generationConfig:{responseMimeType:"application/json", temperature:0.4}})
    }).catch(e=>({ok:false,status:0,json:async()=>({error:{message:"Internet aloqasi yo'q"}})}));
    bumpCounter();
    const j = await r.json().catch(()=>({}));
    if(r.ok){
      const text = ((((j.candidates||[])[0]||{}).content||{}).parts||[]).filter(p=>!p.thought).map(p=>p.text||"").join("");
      if(!text) { lastErr = {message:"Gemini bo'sh javob qaytardi"}; continue; }
      return parseJSON(text);
    }
    lastErr = {status:r.status, message:(j.error&&j.error.message)||("HTTP "+r.status)};
    // 429 (limit), 404/400 (model yo'q), 403 (ruxsat yo'q) bo'lsa keyingi modelni sinaymiz
    if(r.status===401 || (r.status===400 && /API key/i.test(lastErr.message))) break;
    if(![429,404,403,400,500,503].includes(r.status)) break;
  }
  throw lastErr;
}
function parseJSON(t){
  try{ return JSON.parse(t); }catch(e){}
  const m = String(t).match(/[\[{][\s\S]*[\]}]/); if(!m) throw {message:"Javobni o'qib bo'lmadi"};
  return JSON.parse(m[0]);
}
function errText(e){
  if(!e) return "Xatolik yuz berdi.";
  if(e.code==="nokey") return "Avval ⚙️ Sozlamalarda Gemini kalitini kiriting.";
  if(e.status===429) return "Gemini bepul limiti hozircha tugadi. Bir daqiqadan keyin yoki ertaga qayta urinib ko'ring.";
  if(e.status===400 && /API key/i.test(e.message)) return "Gemini kaliti noto'g'ri. ⚙️ Sozlamalarda tekshiring.";
  if(e.status===403) return "Bu kalit bilan Gemini'dan foydalanishga ruxsat yo'q (hudud yoki loyiha cheklovi bo'lishi mumkin).";
  return "Xatolik: "+esc(e.message||"noma'lum");
}

const SCHEMA = `{
 "cards": [
  {
   "ko": "koreyscha so'z, lug'at shaklida (fe'l/sifatlar -다 bilan)",
   "roman": "Revised Romanization bo'yicha o'qilishi",
   "uz": "o'zbekcha tarjima, lotin yozuvida (1–3 ma'no, vergul bilan)",
   "pos": "so'z turkumi o'zbekcha: ot / fe'l / sifat / ravish / ibora ...",
   "hanja": "xanja ildizi bo'lsa (masalan 學校), bo'lmasa bo'sh qator",
   "note": "qisqa foydali izoh o'zbekcha: qachon ishlatiladi, o'xshash so'zdan farqi yoki eslab qolish usuli (120 belgigacha)",
   "examples": [
     {"ko":"kundalik hayotdan oddiy, tabiiy gap (TOPIK 1–2, 해요체)","roman":"o'qilishi","uz":"o'zbekcha tarjimasi"},
     {"ko":"boshqa vaziyatdagi ikkinchi gap","roman":"...","uz":"..."}
   ],
   "emoji": "eng mos bitta emoji",
   "img_query": "rasm qidirish uchun 1–3 so'zli inglizcha so'rov: aniq ko'rinadigan narsa (masalan 'red apple fruit'); mavhum so'z uchun uni ko'rsatadigan sahna",
   "from": "text yoki object"
  }
 ]
}`;
const ROLE = `Sen tajribali koreys tili o'qituvchisisan. O'quvchi o'zbek (lotin yozuvi) tilida so'zlashadi, Koreyada o'qiydi va koreys tilini o'rganmoqda. Faqat JSON qaytar.`;

async function genFromWords(words){
  const prompt = `${ROLE}
Quyidagi so'zlarning har biri uchun bittadan flash-karta tayyorla. So'zlar koreyscha, o'zbekcha, ruscha yoki inglizcha bo'lishi mumkin — har doim koreyscha so'zni asos qilib ol. Tartibni saqla.
So'zlar: ${JSON.stringify(words)}
"from" maydoniga "text" yoz. Javob formati:
${SCHEMA}`;
  const j = await gemini([{text:prompt}]);
  return normalize(j);
}
async function genFromPhoto(blob, hint){
  const small = await shrink(blob, 1600, .85);
  const b64 = (await toDataURL(small)).split(",")[1];
  const prompt = `${ROLE}
Ilova qilingan rasmni ko'rib chiq.
• Agar rasmda koreyscha matn bo'lsa (kitob sahifasi, menyu, yozuv, ekran, daftar), undagi o'rganishga arziydigan so'zlarni ajratib ol: har birini lug'at shakliga keltir (조사 va qo'shimchalarsiz, fe'llar -다 bilan), takrorlanganlarini bir marta ol, juda oddiy yordamchi so'zlarni (은/는, 이/가 kabi) tashla. Eng ko'pi 20 ta. "from": "text".
• Agar rasmda matn bo'lmasa, rasmdagi asosiy narsa(lar)ni aniqla (1–5 ta) va ularning koreyscha nomini ber. "from": "object".
${hint ? `Foydalanuvchi izohi: ${hint}` : ""}
Har bir so'z uchun to'liq flash-karta tayyorla. Javob formati:
${SCHEMA}`;
  const j = await gemini([{text:prompt},{inline_data:{mime_type:"image/jpeg", data:b64}}]);
  return normalize(j);
}
function normalize(j){
  const arr = Array.isArray(j) ? j : (j.cards || []);
  return arr.filter(x=>x && x.ko).map(x=>({
    ko:String(x.ko).trim(), roman:String(x.roman||"").trim(), uz:String(x.uz||"").trim(),
    pos:String(x.pos||"").trim(), hanja:String(x.hanja||"").trim(), note:String(x.note||"").trim(),
    examples:(Array.isArray(x.examples)?x.examples:[]).slice(0,3).map(e=>({ko:String(e.ko||""),roman:String(e.roman||""),uz:String(e.uz||"")})),
    emoji:String(x.emoji||"").slice(0,8), img_query:String(x.img_query||"").trim(), from:x.from==="object"?"object":"text"
  }));
}

const dupOf = ko => cards.find(c=>c.ko===ko);

$("#makeBtn").onclick = async () => {
  if(!settings.key){ openSettings(); return; }
  const raw = $("#inWord").value.trim();
  if(!raw && !photo){ status("So'z yozing yoki rasm yuboring.", true); return; }
  const words = raw ? raw.split(/[\n,，、;]+/).map(s=>s.trim()).filter(Boolean).slice(0,25) : [];
  const btn = $("#makeBtn"); btn.disabled=true;
  try{
    let list, ownImg = null;
    if(words.length){
      status(`<span class="spinner"></span> ${words.length>1?words.length+" ta karta":"Karta"} tayyorlanmoqda…`);
      list = await genFromWords(words);
      if(photo) ownImg = await fileToCardImg(photo.blob);
    } else {
      status(`<span class="spinner"></span> Rasm skanerlanmoqda…`);
      list = await genFromPhoto(photo.blob, "");
      if(list.length && list.every(x=>x.from==="object") && list.length<=2) ownImg = await fileToCardImg(photo.blob);
    }
    if(!list.length){ status("So'z topilmadi. Boshqa rasm yoki so'z bilan urinib ko'ring.", true); return; }
    const fresh = list.map((c,i) => ({
      ...c, _id:uid("d"), sel:!dupOf(c.ko), dup:!!dupOf(c.ko),
      img: (ownImg && (words.length===1 || (!words.length && i===0))) ? ownImg : null,
      own: !!(ownImg && (words.length===1 || (!words.length && i===0))),
      imgOpts:null, imgLoading:false, stripOpen:false
    }));
    drafts = [...fresh, ...drafts];
    status(`✓ ${fresh.length} ta karta tayyor. Tekshirib, «Saqlash»ni bosing.`);
    $("#inWord").value=""; clearPhoto();
    renderDrafts();
    if(settings.autoImg) fresh.filter(d=>!d.img).forEach(d=>autoImage(d));
  }catch(e){ status(errText(e), true); }
  finally{ btn.disabled=false; }
};

async function autoImage(d){
  d.imgLoading = true; renderDrafts();
  const res = await searchImages(d.img_query || d.uz.split(",")[0] || d.ko);
  d.imgOpts = res; d.imgLoading = false;
  if(res[0] && !d.img){ d.img = res[0].thumb; d.credit = res[0].credit; d.remote = true; }
  renderDrafts();
}

  const box = $("#draftsBox");
  if(!drafts.length){ box.innerHTML=""; return; }
  const nSel = drafts.filter(d=>d.sel).length;
  box.innerHTML = `
    <div class="drafts-head">
      <b>${drafts.length} ta yangi karta</b>
      <div class="row">
        <button class="btn sm" id="dAll">${nSel===drafts.length?"Hech birini":"Hammasini"} tanlash</button>
        <button class="btn sm" id="dClear">Tozalash</button>
        <button class="btn primary sm" id="dSave" ${nSel?"":"disabled"}>Saqlash (${nSel})</button>
      </div>
    </div>
    <div class="drafts">${drafts.map(draftHTML).join("")}</div>`;
  $("#dAll").onclick = () => { const v = nSel!==drafts.length; drafts.forEach(d=>d.sel=v); renderDrafts(); };
  $("#dClear").onclick = () => { drafts=[]; renderDrafts(); status(""); };
  $("#dSave").onclick = saveDrafts;
  box.querySelectorAll("[data-sel]").forEach(i => i.onchange = () => { draft(i.dataset.sel).sel = i.checked; renderDrafts(); });
  box.querySelectorAll("[data-uz]").forEach(i => i.oninput = () => { draft(i.dataset.uz).uz = i.value; });
  box.querySelectorAll("[data-act]").forEach(b => b.onclick = () => draftAction(b.dataset.id, b.dataset.act, b));
  box.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const d = draft(b.dataset.id), o = d.imgOpts[+b.dataset.pick];
    d.img = o.thumb; d.credit = o.credit; d.remote = true; d.own=false; renderDrafts();

  box.querySelectorAll("[data-q]").forEach(f => f.onsubmit = async e => {
    e.preventDefault(); const d = draft(f.dataset.q); d.img_query = f.querySelector("input").value.trim();
    d.imgLoading = true; d.stripOpen = true; renderDrafts();
    d.imgOpts = await searchImages(d.img_query); d.imgLoading=false; renderDrafts();
  });
}

let ownTarget = null; // {type:'draft'|'card', id}
$("#fileIn2").onchange = async e => {
  const f = e.target.files[0]; e.target.value=""; if(!f || !ownTarget) return;
  const data = await fileToCardImg(f);

  else { const c=cards.find(x=>x.id===ownTarget.id); if(c){ c.img=data; c.credit=""; await saveCard(c); openCard(c.id); renderAll(); } }

async function draftAction(id, act){
  const d = draft(id); if(!d) return;
  if(act==="own"){ ownTarget={type:"draft",id}; $("#fileIn2").click(); return; }
  if(act==="none"){ d.img=null; d.credit=""; renderDrafts(); return; }
  if(act==="find"){
    d.stripOpen = !d.stripOpen || !d.imgOpts;
    if(!d.imgOpts){ d.imgLoading=true; renderDrafts(); d.imgOpts = await searchImages(d.img_query || d.ko); d.imgLoading=false; }
    renderDrafts();
  }
}
async function saveDrafts(){
  const sel = drafts.filter(d=>d.sel); if(!sel.length) return;
  const btn=$("#dSave"); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saqlanmoqda…';
  const folder = await ensureFolder();
  const now = Date.now(); const out=[];
  for(const d of sel){
    let img = d.img;
    if(img && d.remote) img = await urlToCardImg(img);
    out.push({
      id:uid("c"), ko:d.ko, roman:d.roman, uz:d.uz, pos:d.pos, hanja:d.hanja, note:d.note, examples:d.examples,
      emoji:d.emoji, img_query:d.img_query, img:img||null, credit:d.remote?(d.credit||""):"",
      folder, created:now, due:now, reps:0, interval:0, ease:2.5, lapses:0, last:0
    });
  }
  await persistMany(out); cards.push(...out);
  drafts = drafts.filter(d=>!d.sel);
  status(`✓ ${out.length} ta karta «${esc(folderName(folder))}» papkasiga saqlandi.`);
  renderDrafts(); renderAll();
}
async function ensureFolder(){
  let id = $("#addFolder").value;
  if(id && folders.find(f=>f.id===id)) return id;
  if(!folders.length){ folders=[{id:uid("f"), name:"Asosiy"}]; await saveFolders(folders[0]); }
  return folders[0].id;
}

/* ================= folders ================= */
let addingFolder=false;
function renderFolders(){
  const cnt = id => cards.filter(c=>id==="all"||c.folder===id).length;
  if(curFolder!=="all" && !folders.find(f=>f.id===curFolder)) curFolder="all";
  let h = `<button class="chip ${curFolder==="all"?"on":""}" data-fo="all">Hammasi <span class="n">${cards.length}</span></button>`;
  for(const f of folders) h += `<button class="chip ${curFolder===f.id?"on":""}" data-fo="${esc(f.id)}">📁 ${esc(f.name)} <span class="n">${cnt(f.id)}</span></button>`;
  h += addingFolder ? `<span class="chip add"><input id="newFolder" placeholder="Papka nomi" maxlength="40"><button class="btn sm" id="okFolder">OK</button></span>`
                    : `<button class="chip add" id="addFolderBtn">＋ Papka</button>`;
  if(curFolder!=="all") h += `<button class="chip" id="renFolder">✎ Nomini o'zgartirish</button>`;
  if(curFolder!=="all" && cnt(curFolder)===0) h += `<button class="chip" id="delFolder" style="color:var(--red)">O'chirish</button>`;
  $("#folders").innerHTML = h;
  $("#folders").querySelectorAll("[data-fo]").forEach(b=>b.onclick=()=>{ curFolder=b.dataset.fo; LS.set("folder",curFolder); session=null; pr=null; renderAll(); });
  const ab=$("#addFolderBtn"); if(ab) ab.onclick=()=>{ addingFolder=true; renderFolders(); $("#newFolder").focus(); };
  const ok=$("#okFolder");
  if(ok){
    const go=async()=>{ const name=$("#newFolder").value.trim(); addingFolder=false;
      if(name){ const f={id:uid("f"),name}; folders.push(f); await saveFolders(f); curFolder=f.id; LS.set("folder",curFolder); }
      renderAll(); };
    ok.onclick=go; $("#newFolder").onkeydown=e=>{ if(e.key==="Enter") go(); if(e.key==="Escape"){addingFolder=false;renderFolders();} };
  }
  const rf=$("#renFolder"); if(rf) rf.onclick=()=>{
    const f=folders.find(x=>x.id===curFolder); rf.outerHTML=`<span class="chip add"><input id="renIn" value="${esc(f.name)}" maxlength="40"><button class="btn sm" id="renOk">OK</button></span>`;
    const inp=$("#renIn"); inp.focus(); inp.select();
    const go=async()=>{ const v=inp.value.trim(); if(v){ f.name=v; await saveFolders(f); } renderAll(); };
    $("#renOk").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
  };
  const df=$("#delFolder"); if(df) df.onclick=async()=>{ await removeFolder(curFolder); curFolder="all"; renderAll(); };

  const sel=$("#addFolder"), keep=sel.value;
  sel.innerHTML = folders.length ? folders.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join("") : `<option value="">Asosiy</option>`;
  if(curFolder!=="all") sel.value=curFolder; else if(keep && folders.find(f=>f.id===keep)) sel.value=keep;
  $("#stTotal").textContent = cards.filter(inFolder).length;
  $("#stDue").textContent = dueCards().length;
}

/* ================= spaced repetition ================= */
function schedule(c, g){
  let reps=c.reps||0, interval=c.interval||0, ease=c.ease||2.5, lapses=c.lapses||0, dueIn;
  if(g===0){ if(reps>0) lapses++; reps=0; interval=0; ease=Math.max(1.3,ease-0.2); dueIn=MIN; }
  else if(reps===0){
    if(g===1) dueIn=10*MIN;
    else if(g===2){ interval=1; reps=1; dueIn=DAY; }
    else { interval=3; reps=1; ease+=0.1; dueIn=3*DAY; }
  } else {
    if(g===1){ interval=Math.max(1,interval*1.2); ease=Math.max(1.3,ease-0.15); }
    else if(g===2) interval=Math.max(interval+1, interval*ease);
    else { interval=Math.max(interval+2, interval*ease*1.3); ease+=0.15; }
    reps++; dueIn=interval*DAY;
  }
  return {reps, interval, ease:Math.round(ease*100)/100, lapses, due:Date.now()+dueIn, last:Date.now(), _in:dueIn};
}

/* ================= review ================= */
let session=null;
function startSession(cram){
  let q;
  if(cram) q = cards.filter(inFolder).sort(()=>Math.random()-.5).map(c=>c.id);
  else {
    const due = dueCards().sort((a,b)=>(a.due||0)-(b.due||0));
    q = [...due.filter(c=>!isNew(c)), ...due.filter(isNew).slice(0,20)].map(c=>c.id);
  }
  session={queue:q, done:0, total:q.length, cur:null, flipped:false}; next();
}
function next(){
  if(!session.queue.length){ session.cur=null; renderReview(); return; }
  session.cur={id:session.queue.shift(), dir:Math.random()<.5?"uz":"ko"}; session.flipped=false; renderReview();
}
function backHTML(c){
  return `${picHTML(c)}${c.credit?`<div class="credit" style="margin:-8px 0 8px">${esc(c.credit)}</div>`:""}
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><div class="word-ko">${esc(c.ko)}</div><div class="roman">${esc(c.roman)}</div></div>${spk(c.ko)}</div>
    <div class="word-uz" style="margin-top:6px">${esc(c.uz)}</div>
    <div>${c.pos?`<span class="tag">${esc(c.pos)}</span>`:""}${c.hanja?`<span class="tag h">${esc(c.hanja)}</span>`:""}</div>
    ${c.note?`<div class="note">💡 ${esc(c.note)}</div>`:""}
    ${(c.examples||[]).length?`<div class="sec-t">Misollar</div>`:""}
    ${(c.examples||[]).map(x=>`<div class="ex"><div class="t"><div class="k">${esc(x.ko)}</div><div class="r">${esc(x.roman)}</div><div class="u">${esc(x.uz)}</div></div>${spk(x.ko)}</div>`).join("")}`;
}
function renderReview(){
  const el=$("#tab-review");
  if(!cards.filter(inFolder).length){ el.innerHTML=`<div class="panel empty"><div class="e">🗂️</div><h3>Bu papkada hali so'z yo'q</h3><p class="muted">«Qo'shish» bo'limida birinchi so'zingizni kiriting.</p></div>`; return; }
  if(!session){
    const due=dueCards(), nw=due.filter(isNew).length;
    const up=cards.filter(inFolder).filter(c=>(c.due||0)>Date.now()).sort((a,b)=>a.due-b.due)[0];
    el.innerHTML = due.length
      ? `<div class="panel empty"><div class="e">🧠</div><h3>Takrorlash uchun ${due.length} ta so'z tayyor</h3><p class="muted">${nw?nw+" tasi yangi · ":""}Karta goh o'zbekcha, goh koreyscha tomoni bilan chiqadi.</p><button class="btn primary" id="startBtn" style="margin-top:8px">Boshlash</button></div>`
      : `<div class="panel empty"><div class="e">✅</div><h3>Hozircha takrorlaydigan so'z yo'q</h3><p class="muted">${up?`Keyingisi: «${esc(up.ko)}» — ${fmtIn(up.due-Date.now())}dan keyin.`:""}</p><button class="btn" id="cramBtn" style="margin-top:8px">Baribir hammasini ko'rib chiqish</button></div>`;
    const sb=$("#startBtn"); if(sb) sb.onclick=()=>startSession(false);
    const cb=$("#cramBtn"); if(cb) cb.onclick=()=>startSession(true);
    return;
  }
  if(!session.cur){
    el.innerHTML=`<div class="panel empty"><div class="e">🎉</div><h3>Barakalla! Takrorlash tugadi</h3><p class="muted">${session.done} ta javob berildi. Keyingi so'zlar vaqti kelganda shu yerda chiqadi.</p><button class="btn" id="finBtn" style="margin-top:8px">Yopish</button></div>`;
    $("#finBtn").onclick=()=>{session=null;renderReview();}; return;
  }
  const c=cards.find(x=>x.id===session.cur.id); if(!c){ next(); return; }
  const left=session.queue.length+1, pct=session.done/(session.done+left)*100;
  const front = session.cur.dir==="uz"
    ? `<div class="dir">O'ZBEKCHA → KOREYSCHA</div><div class="big-uz">${esc(c.uz)}</div>${c.pos?`<span class="tag">${esc(c.pos)}</span>`:""}<div class="muted">Koreyschasini eslang</div>`
    : `<div class="dir">KOREYSCHA → O'ZBEKCHA</div><div class="big-ko">${esc(c.ko)}</div>${spk(c.ko)}<div class="muted">Ma'nosini eslang</div>`;
  const prev=[0,1,2,3].map(g=>fmtIn(schedule(c,g)._in));
  el.innerHTML=`
    <div class="review-top"><span>${session.done} ta tayyor</span><div class="bar"><i style="width:${pct}%"></i></div><span>${left} ta qoldi</span></div>
    <div class="flip ${session.flipped?"flipped":""}" id="flip"><div class="inner">
      <div class="face front">${front}<div class="tap">Javobni ko'rish uchun kartani bosing</div></div>
      <div class="face back">${backHTML(c)}</div>
    </div></div>
    <div class="grades ${session.flipped?"":"hidden"}" id="grades">
      <p>Bu so'zni eslash qanchalik oson bo'ldi?</p>
      <div class="g">
        <button class="g0" data-g="0">Eslay olmadim<small>${prev[0]}</small></button>
        <button class="g1" data-g="1">Qiyin<small>${prev[1]}</small></button>
        <button class="g2" data-g="2">Yaxshi<small>${prev[2]}</small></button>
        <button class="g3" data-g="3">Oson<small>${prev[3]}</small></button>
      </div>
    </div>`;
  $("#flip").onclick=()=>{ if(session.flipped) return; session.flipped=true; $("#flip").classList.add("flipped"); $("#grades").classList.remove("hidden"); };
  el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>rate(c,+b.dataset.g));
}
async function rate(c,g){
  const {_in, ...upd}=schedule(c,g); Object.assign(c,upd);
  session.done++; if(_in<=20*MIN) session.queue.push(c.id);
  next(); renderFolders();
  try{ await persist(c); }catch(e){ notice("Natijani saqlab bo'lmadi."); }
}
document.addEventListener("keydown", e=>{
  if(tab!=="review"||!session||!session.cur||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.code==="Space"){ e.preventDefault(); $("#flip")?.click(); }
  if(session.flipped && ["1","2","3","4"].includes(e.key)) document.querySelector(`[data-g="${+e.key-1}"]`)?.click();
});

    el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
      const list=[...pool].sort((a,b)=>((b.lapses||0)-(a.lapses||0))||Math.random()-.5).slice(0,10).sort(()=>Math.random()-.5);
      pr={mode:b.dataset.m,list,i:0,score:0,answered:false}; renderPractice();
    });
    return;
  }
  if(pr.i>=pr.list.length){
    el.innerHTML=`<div class="panel empty"><div class="e">${pr.score>=pr.list.length*.8?"🏆":"💪"}</div><h3>${pr.score} / ${pr.list.length} to'g'ri</h3><p class="muted">${pr.score===pr.list.length?"Ajoyib natija!":"Xato qilingan so'zlar «Takrorlash» bo'limida kutmoqda."}</p>

    $("#again").onclick=()=>{ const m=pr.mode; pr=null; renderPractice(); document.querySelector(`[data-m="${m}"]`)?.click(); };
    $("#back").onclick=()=>{pr=null;renderPractice();}; return;
  }
  const c=pr.list[pr.i];
  const head=`<div class="review-top"><span>${pr.i+1} / ${pr.list.length}</span><div class="bar"><i style="width:${pr.i/pr.list.length*100}%"></i></div><span>✓ ${pr.score}</span></div>`;
  if(pr.mode==="type"){
    el.innerHTML=`<div class="q-wrap">${head}<div class="panel q-card">${picHTML(c)}<div class="word-uz">${esc(c.uz)}</div>${c.pos?`<span class="tag">${esc(c.pos)}</span>`:""}
      <input id="ans" class="field ko" style="margin-top:14px;text-align:center;font-size:20px" placeholder="한국어로 쓰세요" autocomplete="off" autocapitalize="off">
      <div class="fb" id="fb"></div>
      <div class="row" style="justify-content:center;margin-top:6px"><button class="btn primary" id="chk">Tekshirish</button><button class="btn" id="skip">Bilmayman</button></div></div></div>`;
    const inp=$("#ans"); inp.focus();
    const norm=s=>String(s).normalize("NFC").replace(/[\s.,!?~·]/g,"");
    const finish=ok=>{
      pr.answered=true; if(ok) pr.score++; else markWrong(c);
      $("#fb").className="fb "+(ok?"ok":"no");
      $("#fb").innerHTML= ok?`To'g'ri! ${esc(c.ko)} ${spk(c.ko)}`:`To'g'ri javob: <span class="ko">${esc(c.ko)}</span> (${esc(c.roman)}) ${spk(c.ko)}`;
      $("#chk").textContent="Keyingisi →"; $("#skip").classList.add("hidden"); inp.disabled=true; speak(c.ko);
    };
    const go=()=>{ if(pr.answered){pr.i++;pr.answered=false;renderPractice();return;} if(!inp.value.trim()) return; finish(norm(inp.value)===norm(c.ko)); };
    $("#chk").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); }; $("#skip").onclick=()=>finish(false);
    return;
  }
  const askKo=pr.mode==="mc-ko";
  const others=cards.filter(inFolder).filter(x=>x.id!==c.id&&x.ko!==c.ko).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[c,...others].sort(()=>Math.random()-.5);
  el.innerHTML=`<div class="q-wrap">${head}<div class="panel q-card">
    ${askKo?`<div class="word-ko" style="font-size:44px">${esc(c.ko)}</div><div class="row" style="justify-content:center;margin-top:6px">${spk(c.ko)}</div>`:`${picHTML(c)}<div class="word-uz">${esc(c.uz)}</div>`}
    <div class="optsq">${opts.map(o=>`<button data-o="${esc(o.id)}" class="${askKo?"":"ko"}">${esc(askKo?o.uz:o.ko)}</button>`).join("")}</div>
    <div class="fb" id="fb"></div>
    <div class="row hidden" id="nx" style="justify-content:center"><button class="btn primary" id="nextQ">Keyingisi →</button></div></div></div>`;
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    if(pr.answered) return; pr.answered=true;
    const ok=b.dataset.o===c.id; if(ok) pr.score++; else { b.classList.add("wrong"); markWrong(c); }
    el.querySelector(`[data-o="${CSS.escape(c.id)}"]`).classList.add("right");
    $("#fb").className="fb "+(ok?"ok":"no");
    $("#fb").innerHTML= ok?"To'g'ri! 👏":`To'g'ri javob: <span class="ko">${esc(c.ko)}</span> — ${esc(c.uz)}`;
    $("#nx").classList.remove("hidden"); speak(c.ko);
  });
  $("#nextQ").onclick=()=>{pr.i++;pr.answered=false;renderPractice();};
}

    </div>
    <div class="set-sec">
      <h4>3. Zaxira nusxa</h4>
      <p class="muted" style="font-size:13px;margin:0 0 8px">Kartalar shu qurilmada saqlanadi. Boshqa qurilmaga o'tkazish yoki yo'qolmasligi uchun faylga saqlab qo'ying.</p>
      <div class="row"><button class="btn sm" id="expBtn">⬇️ Faylga saqlash</button><button class="btn sm" id="impBtn">⬆️ Fayldan tiklash</button></div>
      <div class="status" id="bkStatus"></div>
    </div>`;
  $("#modal").classList.add("on");
  $("#mx").onclick=closeModal;
  $("#keySave").onclick=async()=>{
    const k=$("#keyIn").value.trim(); if(!k) return;
    const s=$("#keyStatus"); s.className="status"; s.innerHTML='<span class="spinner"></span> Tekshirilmoqda…';
    try{
      const models=await listModels(k);
      settings.key=k; LS.set("key",k); LS.set("keyMod",Date.now()); scheduleSync();
      if(models.length){ settings.models=models; LS.set("models",models); if(!models.includes(settings.model)){ settings.model=models[0]; LS.set("model",settings.model);} }
      notice(""); openSettings(`<span style="color:var(--green)">✓ Kalit ishlayapti. Endi so'z qo'shishingiz mumkin.</span>`);
    }catch(e){ s.className="status err"; s.textContent="Kalit ishlamadi: "+(e.message||""); }
  };
  const gi=$("#gIn"); if(gi) gi.onclick=()=>{ signIn(false); closeModal(); };
  const gs=$("#gSync"); if(gs) gs.onclick=()=>{ tokenOk() ? syncNow() : signIn(false); };
  const go=$("#gOut"); if(go) go.onclick=()=>{ signOut(); openSettings(); };
  cloudState(cloud);
  const ms=$("#modelSel"); if(ms) ms.onchange=()=>{ settings.model=ms.value; LS.set("model",ms.value); };
  $("#expBtn").onclick=async()=>{
    const data={app:"danEo-cards", v:1, exported:new Date().toISOString(), folders, cards};
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`koreys-sozlar-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    $("#bkStatus").textContent=`✓ ${cards.length} ta karta faylga saqlandi.`;
  };
  $("#impBtn").onclick=()=>$("#importIn").click();
}
$("#importIn").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); if(!Array.isArray(d.cards)) throw 0;
    for(const fo of (d.folders||[])) if(!folders.find(x=>x.id===fo.id)) folders.push({...fo, mod:Date.now()});
    await saveFolders();
    const ids=new Set(cards.map(c=>c.id)); const add=d.cards.filter(c=>c&&c.id&&c.ko);
    await persistMany(add);
    add.forEach(c=>{ if(ids.has(c.id)) cards[cards.findIndex(x=>x.id===c.id)]=c; else cards.push(c); });
    renderAll(); const s=$("#bkStatus"); if(s) s.textContent=`✓ ${add.length} ta karta tiklandi.`;
  }catch(err){ const s=$("#bkStatus"); if(s){ s.className="status err"; s.textContent="Bu fayl zaxira nusxa emas."; } }
};

/* ================= Google Drive sinxronlash ================= */
// OAuth Client ID ochiq ma'lumot (maxfiy emas) — u faqat shu sayt manzilidan ishlaydi.
const GOOGLE_CLIENT_ID = "523791305083-s3oju6k5qmq3ndt70fca6mfdj612p0fq.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/drive.appdata"; // faqat dasturning yashirin papkasi
const DRIVE = "https://www.googleapis.com/drive/v3", UPLOAD = "https://www.googleapis.com/upload/drive/v3";
const DATA_FILE = "danEo-data.json";
let gToken=null, gExp=0, tokenClient=null, syncing=false, syncAgain=false, syncTimer=null, cloud="off";
const tokenOk = () => gToken && Date.now() < gExp;

function cloudState(st, msg){
  cloud = st;
  const b = $("#cloudBtn"); if(!b) return;
  b.classList.toggle("hidden", !GOOGLE_CLIENT_ID);
  const map = {off:["☁️","Google bilan kirish"], sync:['<span class="spinner"></span>',"Sinxronlanmoqda…"], ok:["☁️<i class='cdot ok'></i>","Sinxronlangan"], need:["☁️<i class='cdot need'></i>","Sinxronlash uchun bosing"], err:["☁️<i class='cdot err'></i>", msg||"Sinxronlashda xato"]};
  const [h,t] = map[st]||map.off; b.innerHTML=h; b.title=t;
  const s = $("#syncStatus"); if(s) s.textContent = t + (st==="ok" && LS.get("lastSync",0) ? " · "+new Date(LS.get("lastSync",0)).toLocaleTimeString() : "");
}
function initGis(){
  if(tokenClient || !GOOGLE_CLIENT_ID || !(window.google && google.accounts && google.accounts.oauth2)) return !!tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: SCOPE,
    callback: r => {
      if(r.error){ cloudState(LS.get("gsign",false)?"need":"off"); return; }
      gToken = r.access_token; gExp = Date.now() + (Number(r.expires_in||3600)-120)*1000;
      LS.set("gsign", true); syncNow();
    },
    error_callback: () => cloudState(LS.get("gsign",false)?"need":"off")
  });
  return true;
}
function signIn(silent){
  if(!initGis()){ cloudState("err","Google xizmati yuklanmadi"); return; }
  tokenClient.requestAccessToken({prompt: silent ? "none" : (LS.get("gsign",false) ? "" : "consent")});
}
function signOut(){
  try{ if(gToken) google.accounts.oauth2.revoke(gToken, ()=>{}); }catch(e){}
  gToken=null; gExp=0; LS.set("gsign", false); cloudState("off");
}
function scheduleSync(){
  if(!GOOGLE_CLIENT_ID || !LS.get("gsign",false)) return;
  if(!tokenOk()){ cloudState("need"); return; }
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 2500);
}
async function gfetch(url, opts={}){
  const r = await fetch(url, {...opts, headers:{...(opts.headers||{}), Authorization:"Bearer "+gToken}});
  if(r.status===401){ gToken=null; throw {code:"auth"}; }
  if(!r.ok) throw {status:r.status, message:(await r.text()).slice(0,200)};
  return r;
}
async function driveList(){
  const out = {}; let page = "";
  do{
    const r = await gfetch(`${DRIVE}/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)${page?"&pageToken="+encodeURIComponent(page):""}`);
    const j = await r.json(); (j.files||[]).forEach(f=>{ out[f.name]=f.id; }); page = j.nextPageToken||"";
  } while(page);
  return out;
}
async function driveCreate(name, blob){
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify({name, parents:["appDataFolder"]})], {type:"application/json"}));
  fd.append("file", blob);
  const r = await gfetch(`${UPLOAD}/files?uploadType=multipart&fields=id`, {method:"POST", body:fd});
  return (await r.json()).id;
}
const driveUpdate = (id, blob) => gfetch(`${UPLOAD}/files/${id}?uploadType=media`, {method:"PATCH", body:blob});
const driveGet = id => gfetch(`${DRIVE}/files/${id}?alt=media`);
const driveDel = id => gfetch(`${DRIVE}/files/${id}`, {method:"DELETE"}).catch(()=>{});

function forCloud(c){ const o={...c}; if(o.img && o.img.startsWith("data:")) o.img=null; return o; }
function mergeTomb(a={}, b={}){ const o={...a}; for(const k in b) o[k]=Math.max(o[k]||0, b[k]); return o; }
function mergeById(local, remote, tomb){
  const m = new Map();
  for(const x of remote) m.set(x.id, {item:x, from:"r"});
  for(const x of local){ const r=m.get(x.id); if(!r || (x.mod||0) >= (r.item.mod||0)) m.set(x.id, {item:x, from:"l"}); }
  return [...m.values()].filter(v => !(tomb[v.item.id] && tomb[v.item.id] >= (v.item.mod||0)));
}

async function syncNow(){
  if(!tokenOk()){ if(LS.get("gsign",false)) cloudState("need"); return; }
  if(syncing){ syncAgain=true; return; }
  syncing=true; cloudState("sync");
  try{
    const files = await driveList();
    let remote = {cards:[], folders:[], deleted:{}, fdeleted:{}, settings:{}}, remoteText = "";
    if(files[DATA_FILE]){ remoteText = await (await driveGet(files[DATA_FILE])).text(); try{ remote = {...remote, ...JSON.parse(remoteText)}; }catch(e){} }

    const deleted = mergeTomb((await idb.get("deleted"))||{}, remote.deleted);
    const fdeleted = mergeTomb((await idb.get("fdeleted"))||{}, remote.fdeleted);
    const byLocal = new Map(cards.map(c=>[c.id,c]));

    // kartalar
    const merged = mergeById(cards, remote.cards||[], deleted);
    const nextCards = [], changed = [];
    for(const {item, from} of merged){
      if(from==="l"){ nextCards.push(item); continue; }
      const loc = byLocal.get(item.id), c = {...item};
      if(c.imgName && loc && loc.imgName===c.imgName && loc.img) c.img = loc.img;   // rasm o'zgarmagan
      nextCards.push(c); changed.push(c);
    }
    const goneIds = cards.filter(c=>!nextCards.find(n=>n.id===c.id)).map(c=>c.id);
    // yetishmayotgan rasmlarni yuklab olish
    for(const c of nextCards){
      if(c.imgName && !(c.img && c.img.startsWith("data:")) && files[c.imgName]){
        try{ c.img = await toDataURL(new Blob([await (await driveGet(files[c.imgName])).blob()], {type:"image/jpeg"})); if(!changed.includes(c)) changed.push(c); }catch(e){}
      }
    }
    if(changed.length) await idb.putMany(changed);           // mod o'zgarmaydi
    for(const id of goneIds) await idb.del(id);
    cards = nextCards;
    await idb.set("deleted", deleted);

    // papkalar
    folders = mergeById(folders, remote.folders||[], fdeleted).map(v=>v.item);
    await idb.set("folders", folders); await idb.set("fdeleted", fdeleted);

    // Gemini kaliti (faqat sizning Drive'ingizdagi yashirin papkada)
    const rs = remote.settings||{};
    if(rs.key && (!settings.key || (rs.keyMod||0) > LS.get("keyMod",0))){ settings.key=rs.key; LS.set("key",rs.key); LS.set("keyMod",rs.keyMod||0); notice(""); }

    // rasmlarni yuklash
    for(const c of cards){
      if(c.imgName && c.img && c.img.startsWith("data:") && !files[c.imgName]){
        const blob = await (await fetch(c.img)).blob();
        files[c.imgName] = await driveCreate(c.imgName, blob);
      }
    }
    // ma'lumot fayli
    const data = {app:"danEo-cards", v:2, cards:cards.map(forCloud), folders, deleted, fdeleted,
                  settings: settings.key ? {key:settings.key, keyMod:LS.get("keyMod",0)} : (rs.key?rs:{})};
    const text = JSON.stringify(data);
    if(text !== remoteText){
      const blob = new Blob([text], {type:"application/json"});
      if(files[DATA_FILE]) await driveUpdate(files[DATA_FILE], blob); else await driveCreate(DATA_FILE, blob);
    }
    // keraksiz eski rasmlarni o'chirish
    const used = new Set(cards.map(c=>c.imgName).filter(Boolean));
    for(const name in files) if(/^img-/.test(name) && !used.has(name)) await driveDel(files[name]);

    LS.set("lastSync", Date.now()); cloudState("ok"); renderAll();
  }catch(e){
    if(e && e.code==="auth") cloudState("need");
    else cloudState("err", "Sinxronlashda xato: " + (e && (e.message||e.status) || "aloqa yo'q"));
  }finally{
    syncing=false;
    if(syncAgain){ syncAgain=false; setTimeout(syncNow, 500); }
  }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && tokenOk()) syncNow(); });
function bootGoogle(){
  if(!GOOGLE_CLIENT_ID){ cloudState("off"); return; }
  cloudState(LS.get("gsign",false) ? "need" : "off");
  let tries=0;
  const t = setInterval(()=>{
    tries++;
    if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(t); initGis(); if(LS.get("gsign",false)) signIn(true); }
    else if(tries>40) clearInterval(t);
  }, 250);
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["add","review","practice","library"].forEach(t=>$("#tab-"+t).classList.toggle("hidden",t!==tab));
  if(tab!=="practice") pr=null;
  renderAll();
});
function renderAll(){
  renderFolders();
  if(tab==="review" && (!session || !session.flipped)) renderReview();
  if(tab==="practice" && !pr) renderPractice();
  if(tab==="library") renderLibrary();
}
async function init(){
  try{
    cards = (await idb.all()) || [];
    folders = (await idb.get("folders")) || [];
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){ notice("Brauzer xotirasiga ulanib bo'lmadi. Maxfiy (incognito) rejimda bo'lsangiz, oddiy oynada oching."); }
  renderAll();
  bootGoogle();
  if(!settings.key) notice(`Boshlash uchun bepul Gemini kalitini kiriting: <a href="#" id="nk" style="color:inherit;font-weight:800">⚙️ Sozlamalarni ochish</a>`), $("#nk") && ($("#nk").onclick=e=>{e.preventDefault();openSettings();});
}
init();
})();
