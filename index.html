<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>단어 — Koreyscha so'z kartalari</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --paper:#fffdf9; --ink:#1f1c19; --muted:#7b736a; --line:#e6ded2;
  --red:#b93a26; --red-soft:#f6e3dc; --blue:#1f4e79; --blue-soft:#e1ebf4;
  --green:#2f7d4f; --green-soft:#e0f0e6; --amber:#b7791f; --amber-soft:#f8ecd6;
  --r:16px; --shadow:0 1px 2px rgba(40,30,20,.06),0 8px 28px rgba(40,30,20,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.ko{font-family:"Noto Sans KR",sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--red);font-family:"Noto Sans KR";font-weight:900;margin-right:6px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:6px;align-items:center}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5px 10px;text-align:right;min-width:62px}
.stat b{display:block;font-size:17px;line-height:1.1}
.stat small{color:var(--muted);font-size:10.5px}
.statsbtn{display:flex;gap:6px;border:0;background:none;padding:0;cursor:pointer}
.statsbtn .stat{display:block;position:relative}
.statsbtn .stat:first-child::after{content:"📊";position:absolute;top:-6px;left:-6px;font-size:12px;background:var(--paper);border-radius:99px;padding:1px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr}}
.kpis div{background:#faf6ef;border-radius:12px;padding:10px;text-align:center}
.kpis b{display:block;font-size:20px}.kpis small{color:var(--muted);font-size:11.5px}
.up{color:var(--green);font-weight:800}.down{color:var(--red);font-weight:800}
.chart{width:100%;height:auto;margin-top:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#eee6da;margin-top:6px}
.s-new{background:#d8cfc2}.s-learn{background:#e6a23c}.s-young{background:#4a86c5}.s-mature{background:#2f7d4f}
.krow{display:grid;grid-template-columns:1.4fr .6fr 1.4fr .5fr;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.kbar{height:8px;background:#eee6da;border-radius:99px;overflow:hidden}.kbar i{display:block;height:100%;background:var(--green)}
.gear{border:1px solid var(--line);background:var(--paper);border-radius:12px;width:44px;height:44px;font-size:19px;position:relative;flex:none}
.cdot{position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--paper)}
.cdot.ok{background:var(--green)}.cdot.need{background:var(--amber)}.cdot.err{background:var(--red)}
@media (max-width:420px){.stat{min-width:0;padding:5px 8px}.brand p{display:none}}
nav.tabs{display:flex;gap:4px;background:#ebe4d9;padding:4px;border-radius:14px;margin-bottom:12px;position:sticky;top:6px;z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;padding:7px 1px 6px;border-radius:10px;font-weight:700;color:#5d564e;font-size:12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
nav.tabs button i{font-style:normal;font-size:17px;line-height:1}
@media (max-width:420px){nav.tabs button{font-size:10.5px;letter-spacing:-.01em}}
.badge{position:absolute;top:2px;right:6px;background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px;line-height:1.3}
.g-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;background:#fff}
.g-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.g-title{font-size:26px;font-weight:700}
.g-ask{background:var(--blue-soft);color:#173b5c;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.g-p{font-size:14.5px;line-height:1.6;color:#2f2a25}
.g-list{margin:4px 0 0;padding-left:20px;font-size:14.5px;line-height:1.7}
.g-list.warn li::marker{content:"⚠️ "}
.g-qa{border-left:3px solid var(--blue);padding:4px 0 4px 10px;margin:8px 0}
.g-qa .q{font-weight:700;font-size:14px;margin-bottom:4px}
.g-img{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:6px}
.g-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.g-act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px}
.g-act:disabled{opacity:.55}
.g-act .i{font-size:22px}.g-act span:last-child{font-size:12.5px;color:var(--muted)}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.g-tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.g-tt{font-size:18px;font-weight:700}
.g-tm{font-size:12.5px;color:#4f4942;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-tile .d{font-size:11px;color:var(--muted)}
.g-front-t{font-size:40px;font-weight:700}
.g-front-s{font-size:21px;line-height:1.6;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--red);color:transparent}
.g-ans{font-size:17px;background:var(--green-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* sonlar */
.num-hero{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nh-t{font-size:18px;font-weight:800}
.pill{background:var(--amber-soft);color:#7a5414;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px}
.table-link{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px 16px}
.mode:disabled{opacity:.55}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.rule-grid{grid-template-columns:1fr}}
.rule{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.rule.n{background:var(--blue-soft);color:#173b5c}.rule.s{background:var(--amber-soft);color:#6b4a12}
.ntable{width:100%;border-collapse:collapse;font-size:14.5px}
.ntable th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px}
.ntable td{padding:5px 6px;border-top:1px solid var(--line);white-space:nowrap}
.ntable .iconbtn{width:26px;height:26px;font-size:11px;vertical-align:middle}
.ex-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.ex-row:first-of-type{border-top:0}
.ex-row .iconbtn{width:28px;height:28px;font-size:12px}
.ex-uz{font-size:12.5px;margin-left:auto}
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lesson-top .bar{flex:1;height:10px}
.combo{font-weight:800;color:var(--muted);font-size:14px;min-width:46px;text-align:right}
.combo.hot{color:#e8590c}
.q-title{font-weight:800;font-size:17px;margin-bottom:12px}
.big-prompt{font-size:44px;font-weight:800;margin:6px 0;line-height:1.1}
.big-prompt.ko{font-family:"Noto Sans KR";font-weight:700}
.optsq.one{grid-template-columns:1fr}
.big-say{width:84px;height:84px;border-radius:24px;border:0;background:var(--blue);color:#fff;font-size:34px;box-shadow:0 4px 0 #143553}
.big-say:active{transform:translateY(3px);box-shadow:0 1px 0 #143553}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:38px;margin:18px auto 8px;display:grid;place-items:center;box-shadow:0 4px 0 #8a2a1b}
.mic.on{animation:pulse 1.1s ease-in-out infinite;background:#d9480f}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,72,15,.45)}50%{box-shadow:0 0 0 18px rgba(217,72,15,0)}}
.fb-bar{margin-top:12px;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.fb-bar.ok{background:var(--green-soft);color:#1d5a37}.fb-bar.no{background:var(--red-soft);color:#8a2a1b}
.fb-h{font-weight:800;font-size:18px}
.fb-c{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb-s{font-size:13px;opacity:.9}
.fb-bar .btn{margin-top:6px;align-self:stretch}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.end-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:480px){.end-stats{grid-template-columns:1fr 1fr}}
.end-stats div{background:#faf6ef;border-radius:12px;padding:10px 6px}
.end-stats b{display:block;font-size:20px}.end-stats small{color:var(--muted);font-size:11.5px}
nav.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.folders{display:flex;gap:6px;margin-bottom:14px;align-items:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:#4b453f;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.6;font-weight:500}
.chip.add{border-style:dashed;color:var(--muted)}
.chip input{border:0;outline:0;background:transparent;width:110px;font-size:13px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;outline:none;transition:border .15s}
.field:focus{border-color:var(--blue)}
textarea.field{resize:vertical;min-height:54px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:15px;flex:none}
.status{font-size:13px;margin-top:10px;min-height:18px}
.status.err{color:var(--red)}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.install-bar{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.install-bar img{width:40px;height:40px;border-radius:10px}
.notice{background:var(--amber-soft);color:#7a5414;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.hidden{display:none!important}
.switch{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch i{width:38px;height:22px;border-radius:99px;background:#d8cfc2;position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{left:19px}

/* add */
.add-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.photo-chip{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:12px;padding:8px 10px;margin-top:10px;font-size:13px;color:var(--blue)}
.photo-chip img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.opts-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}

/* drafts */
.drafts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.drafts-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.draft{display:grid;grid-template-columns:28px 120px 1fr;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.draft.off{opacity:.55}
@media (max-width:560px){.draft{grid-template-columns:24px 92px 1fr;gap:10px;padding:10px}}
.draft .ck input{width:20px;height:20px;accent-color:var(--red);margin-top:4px}
.pic{width:100%;aspect-ratio:1;border-radius:12px;background:#f2ede5;display:grid;place-items:center;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .emo{font-size:44px}
.pic .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.dk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dk .w{font-family:"Noto Sans KR";font-weight:700;font-size:22px}
.dk .r{color:var(--muted);font-size:13px}
.d-uz{margin-top:6px;padding:7px 10px;border-radius:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin:6px 4px 0 0}
.tag.h{background:var(--amber-soft);color:var(--amber)}
.tag.dup{background:var(--red-soft);color:var(--red)}
.mini-ex{font-size:12.5px;color:#5a534b;margin-top:6px;line-height:1.45}
.mini-ex .k{font-family:"Noto Sans KR";color:var(--ink)}
.img-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.strip button{flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:#f2ede5}
.strip button.on{border-color:var(--red)}
.strip img{width:100%;height:100%;object-fit:cover}
.strip .q{display:flex;gap:6px;margin-top:6px}

/* card faces */
.word-ko{font-family:"Noto Sans KR";font-weight:700;font-size:32px;line-height:1.15}
.roman{color:var(--muted);font-size:14px}
.word-uz{font-size:19px;font-weight:700}
.word-en{font-size:14.5px;color:#4b5f73;margin-top:2px}
.ex .en{font-size:12.5px;color:#4b5f73;margin-top:1px}
.d-en{margin-top:4px;font-size:13.5px;color:#4b5f73}
.en-fill{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--blue-soft);color:#173b5c;border-radius:12px;padding:9px 12px;margin-top:10px;font-size:13px}
.note{font-size:13.5px;color:#4f4942;background:#faf6ef;border-radius:10px;padding:8px 10px;margin-top:10px}
.ex{border-top:1px solid var(--line);padding:10px 0 2px;display:flex;gap:10px;align-items:flex-start}
.ex .t{flex:1}
.ex .k{font-family:"Noto Sans KR";font-size:15.5px;font-weight:500}
.ex .r{font-size:12px;color:var(--muted)}
.ex .u{font-size:13.5px;color:#4f4942;margin-top:1px}
.sec-t{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:14px 0 2px}
.review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.bar{height:5px;background:#e8e0d4;border-radius:9px;overflow:hidden;flex:1;margin:0 12px}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.flip{perspective:1400px;cursor:pointer;max-width:520px;margin:0 auto}
.flip .inner{position:relative;height:min(560px,64vh);transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.front .big-ko{font-family:"Noto Sans KR";font-weight:700;font-size:54px;line-height:1.1}
.front .big-uz{font-size:32px;font-weight:800;letter-spacing:-.02em}
.front .dir{position:absolute;top:16px;left:18px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.front .tap{position:absolute;bottom:18px;font-size:12.5px;color:var(--muted)}
.back{transform:rotateY(180deg);overflow-y:auto}
.back .pic{aspect-ratio:16/10;margin-bottom:12px}
.back .pic img{object-fit:cover}
.grades{max-width:520px;margin:14px auto 0}
.grades p{text-align:center;margin:0 0 10px;font-weight:700}
.grades .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades button{border:1px solid var(--line);border-radius:14px;padding:10px 2px;background:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13.5px}
.grades button small{font-weight:500;color:var(--muted);font-size:11px}
.grades .g0{color:var(--red)} .grades .g1{color:var(--amber)} .grades .g2{color:var(--blue)} .grades .g3{color:var(--green)}
.empty{text-align:center;padding:36px 16px}
.empty .e{font-size:44px}
.empty h3{margin:8px 0 4px}

/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:left;display:flex;flex-direction:column;gap:5px}
.tile .pic{aspect-ratio:4/3}
.tile .pic .emo{font-size:36px}
.tile .k{font-family:"Noto Sans KR";font-weight:700;font-size:18px}
.tile .u{font-size:13px;color:#4f4942;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px;background:#c9c0b3}
.dot.due{background:var(--red)} .dot.ok{background:var(--green)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,24,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.modal .box{background:var(--paper);border-radius:20px 20px 0 0;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));position:relative}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
.modal .x{position:absolute;top:12px;right:12px}
.set-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MIN=60e3, HOUR=3600e3, DAY=86400e3;

/* ================= storage (IndexedDB) ================= */
const idb = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open("danEo-cards", 2);
    r.onupgradeneeded = () => { const d = r.result;
      if(!d.objectStoreNames.contains("cards")) d.createObjectStore("cards", {keyPath:"id"});
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      if(!d.objectStoreNames.contains("grammar")) d.createObjectStore("grammar", {keyPath:"id"}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    all: () => run("cards","readonly", s => s.getAll()),
    put: c => run("cards","readwrite", s => s.put(c)),
    putMany: list => run("cards","readwrite", s => { list.forEach(c => s.put(c)); return null; }),
    del: id => run("cards","readwrite", s => s.delete(id)),
    gAll: () => run("grammar","readonly", s => s.getAll()),
    gPut: g => run("grammar","readwrite", s => s.put(g)),
    gPutMany: list => run("grammar","readwrite", s => { list.forEach(g => s.put(g)); return null; }),
    gDel: id => run("grammar","readwrite", s => s.delete(id)),
    get: k => run("kv","readonly", s => s.get(k)),
    set: (k,v) => run("kv","readwrite", s => s.put(v,k)),
  };
})();
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("danEo."+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("danEo."+k, JSON.stringify(v)); }catch(e){} }
};

let cards = [], folders = [], curFolder = LS.get("folder","all"), tab = "add";
let photo = null;            // {blob, url}
let drafts = [];             // generated, not yet saved
const settings = { key: LS.get("key",""), model: LS.get("model",""), models: LS.get("models",[]), autoImg: LS.get("autoImg", true) };

function imgSig(img){ let h=5381; const t=img.slice(-400); for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return img.length.toString(36)+(h>>>0).toString(36); }
function stamp(c){
  c.mod = Date.now();
  if(c.img && c.img.startsWith("data:")){ const sg=imgSig(c.img); if(sg!==c.imgSig){ c.imgSig=sg; c.imgName=`img-${c.id}-${sg}.jpg`; } }
  else { c.imgSig=null; c.imgName=null; }
  return c;
}
async function persist(c){ stamp(c); await idb.put(c); scheduleSync(); }
async function persistMany(list){ list.forEach(stamp); await idb.putMany(list); scheduleSync(); }
async function removeCard(id){ const t=(await idb.get("deleted"))||{}; t[id]=Date.now(); await idb.set("deleted",t); await idb.del(id); cards=cards.filter(x=>x.id!==id); scheduleSync(); }
async function saveCard(c){ const i = cards.findIndex(x=>x.id===c.id); if(i>=0) cards[i]=c; else cards.push(c); await persist(c); }
async function saveFolders(changed){ if(changed) changed.mod=Date.now(); await idb.set("folders", folders); scheduleSync(); }
async function removeFolder(id){ const t=(await idb.get("fdeleted"))||{}; t[id]=Date.now(); await idb.set("fdeleted",t); folders=folders.filter(f=>f.id!==id); await saveFolders(); }

/* ================= helpers ================= */
function notice(m){ const n=$("#notice"); if(!m){n.classList.add("hidden");return;} n.innerHTML=m; n.classList.remove("hidden"); }
function status(m, err){ const s=$("#addStatus"); s.className="status"+(err?" err":""); s.innerHTML=m||""; }
function fmtIn(ms){
  if(ms<HOUR) return Math.max(1,Math.round(ms/MIN))+" daq";
  if(ms<DAY) return Math.round(ms/HOUR)+" soat";
  const d=ms/DAY; if(d<30) return Math.round(d)+" kun";
  if(d<365) return (Math.round(d/30*10)/10)+" oy";
  return (Math.round(d/365*10)/10)+" yil";
}
function isNew(c){ return !c.reps && !c.last; }
function dueLabel(c){ const diff=(c.due||0)-Date.now(); if(isNew(c)) return "yangi"; if(diff<=0) return "takrorlash vaqti"; return fmtIn(diff)+"dan keyin"; }
function folderName(id){ return (folders.find(f=>f.id===id)||{}).name || "—"; }
function inFolder(c){ return curFolder==="all" || c.folder===curFolder; }
function dueCards(){ const now=Date.now(); return cards.filter(c=>inFolder(c)&&(c.due||0)<=now); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function picHTML(c, loading){
  if(loading) return `<div class="pic"><span class="ld"><span class="spinner"></span></span></div>`;
  if(c.img) return `<div class="pic"><img src="${esc(c.img)}" alt="" loading="lazy" onerror="this.remove()"></div>`;
  return `<div class="pic"><span class="emo">${esc(c.emoji||"📘")}</span></div>`;
}

let koVoice = null;
function pickVoice(){ const v = speechSynthesis.getVoices(); koVoice = v.find(x=>/^ko/i.test(x.lang)) || null; }
const canSpeak = "speechSynthesis" in window;
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t, rate){
  if(!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang="ko-KR"; u.rate=rate||.9; if(koVoice) u.voice=koVoice;
  speechSynthesis.speak(u);
}
const spk = t => canSpeak ? `<button class="iconbtn" data-say="${esc(t)}" title="Eshitish">🔊</button>` : "";
document.addEventListener("click", e => { const b=e.target.closest("[data-say]"); if(!b) return; e.stopPropagation(); speak(b.dataset.say); }, true);

/* ================= images ================= */
async function shrink(blob, max=480, q=.82){
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
const toDataURL = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
async function fileToCardImg(file){ return toDataURL(await shrink(file, 520, .8)); }
async function urlToCardImg(url){
  try{ const r = await fetch(url, {mode:"cors"}); if(!r.ok) throw 0; return await toDataURL(await shrink(await r.blob(), 520, .8)); }
  catch(e){ return url; } // CORS bo'lmasa, havolani o'zini saqlaymiz
}
const imgCache = new Map();
async function searchImages(q){
  q = String(q||"").trim(); if(!q) return [];
  if(imgCache.has(q)) return imgCache.get(q);
  const out = [];
  const ov = fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=10&mature=false`)
    .then(r=>r.ok?r.json():{results:[]})
    .then(j=>(j.results||[]).forEach(x=>{ if(x.thumbnail) out.push({thumb:x.thumbnail, src:x.thumbnail, credit:(x.creator?x.creator+" · ":"")+(x.license||"").toUpperCase()+" (Openverse)"}); }))
    .catch(()=>{});
  const wm = fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url|mime&iiurlwidth=480&format=json&origin=*`)
    .then(r=>r.ok?r.json():{})
    .then(j=>Object.values((j.query||{}).pages||{}).sort((a,b)=>(a.index||0)-(b.index||0)).forEach(p=>{
      const ii=(p.imageinfo||[])[0]; if(ii && /jpeg|png|webp/.test(ii.mime||"") && ii.thumburl) out.push({thumb:ii.thumburl, src:ii.thumburl, credit:"Wikimedia Commons"});
    }))
    .catch(()=>{});
  await Promise.all([ov, wm]);
  // Openverse natijalari oldin, keyin Wikimedia
  imgCache.set(q, out);
  return out;
}

/* ================= Gemini ================= */
const API = "https://generativelanguage.googleapis.com/v1beta";
function bumpCounter(){
  const d = new Date().toISOString().slice(0,10), c = LS.get("count",{d,n:0});
  const n = c.d===d ? c.n+1 : 1; LS.set("count",{d,n}); return n;
}
function todayCount(){ const d=new Date().toISOString().slice(0,10), c=LS.get("count",{d,n:0}); return c.d===d?c.n:0; }

async function listModels(key){
  const r = await fetch(`${API}/models?pageSize=200`, {headers:{"x-goog-api-key":key}});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw {status:r.status, message:(j.error&&j.error.message)||"Kalit ishlamadi"};
  const ok = (j.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes("generateContent"))
    .map(m => m.name.replace(/^models\//,""))
    .filter(n => /^gemini-/.test(n) && /flash/.test(n) && !/(image|tts|audio|live|embedding|thinking-exp|robotics|computer)/.test(n));
  const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
  const score = n => ver(n)*10 - (/lite/.test(n)?3:0) - (/preview|exp/.test(n)?1.5:0) - (/-\d{3}$|\d{2}-\d{2}/.test(n)?0.5:0);
  return [...new Set(ok)].sort((a,b)=>score(b)-score(a));
}
async function ensureModels(force){
  // Model ro'yxatini Google'dan o'zi oladi: yangi qurilmada ham, haftada bir marta ham yangilanadi
  const fresh = Date.now() - LS.get("modelsAt",0) < 7*DAY;
  if(!force && settings.models.length && fresh) return;
  try{
    const models = await listModels(settings.key);
    if(models.length){
      settings.models = models; LS.set("models", models); LS.set("modelsAt", Date.now());
      if(!models.includes(settings.model)){ settings.model = models[0]; LS.set("model", settings.model); }
    }
  }catch(e){}
}
function modelOrder(){
  const list = settings.models.length ? settings.models : ["gemini-flash-latest","gemini-flash-lite-latest","gemini-2.5-flash"];
  const first = settings.model && list.includes(settings.model) ? settings.model : list[0];
  return [first, ...list.filter(m=>m!==first)].slice(0,4);
}
function thinkCfg(model){
  // Tez javob uchun modelning "o'ylash" vaqtini kamaytiramiz
  if(/gemini-2\.5-flash(?!-lite)/.test(model)) return {thinkingBudget:0};
  if(/gemini-([3-9]|\d{2})/.test(model)) return {thinkingLevel:"low"};
  return null;
}
async function readSSE(r, onText){
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf="", text="";
  for(;;){
    const {done,value}=await rd.read(); if(done) break;
    buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
      if(!line.startsWith("data:")) continue;
      try{ const j=JSON.parse(line.slice(5));
        const t=((((j.candidates||[])[0]||{}).content||{}).parts||[]).filter(p=>!p.thought).map(p=>p.text||"").join("");
        if(t){ text+=t; onText(text); } }catch(e){}
    }
  }
  return text;
}
function cardStreamer(onCard){
  // JSON to'liq kelishini kutmasdan, har bir tayyor kartani darhol ajratib oladi
  let pos=-1;
  return full=>{
    if(pos<0){ const k=full.indexOf("["); if(k<0) return; pos=k+1; }
    for(;;){
      const st=full.indexOf("{",pos); if(st<0) return;
      let depth=0,inStr=false,escp=false,end=-1;
      for(let i=st;i<full.length;i++){
        const ch=full[i];
        if(inStr){ if(escp) escp=false; else if(ch==="\\") escp=true; else if(ch==='"') inStr=false; continue; }
        if(ch==='"') inStr=true; else if(ch==="{") depth++; else if(ch==="}"){ depth--; if(!depth){ end=i; break; } }
      }
      if(end<0) return;
      try{ onCard(JSON.parse(full.slice(st,end+1))); }catch(e){}
      pos=end+1;
    }
  };
}
const noThink = new Set();
async function gemini(parts, opts={}, retried){
  if(!settings.key) throw {code:"nokey"};
  await ensureModels(false);
  let lastErr, gone=false;
  const queue = modelOrder(), tried = new Set();
  while(queue.length && tried.size < 6){
    const model = queue.shift(); if(tried.has(model)) continue; tried.add(model);
    const genCfg = {responseMimeType:"application/json", temperature:0.4};
    const tc = noThink.has(model) ? null : thinkCfg(model); if(tc) genCfg.thinkingConfig = tc;
    const stream = !!opts.onCard && !!(window.ReadableStream && window.TextDecoder);
    const url = `${API}/models/${encodeURIComponent(model)}:${stream?"streamGenerateContent?alt=sse":"generateContent"}`;
    const r = await fetch(url, {
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":settings.key},
      body: JSON.stringify({contents:[{role:"user",parts}], generationConfig:genCfg})
    }).catch(e=>({ok:false,status:0,json:async()=>({error:{message:"Internet aloqasi yo'q"}})}));
    bumpCounter();
    if(r.ok){
      let text="";
      try{
        if(stream){ const push=cardStreamer(opts.onCard); text = await readSSE(r, push); }
        else { const j = await r.json(); text = ((((j.candidates||[])[0]||{}).content||{}).parts||[]).filter(p=>!p.thought).map(p=>p.text||"").join(""); }
      }catch(e){ lastErr={message:"Javob uzilib qoldi"}; continue; }
      if(!text) { lastErr = {message:"Gemini bo'sh javob qaytardi"}; continue; }
      if(settings.model !== model){ settings.model = model; LS.set("model", model); }
      return parseJSON(text);
    }
    const j = await r.json().catch(()=>({}));
    lastErr = {status:r.status, message:(j.error&&j.error.message)||("HTTP "+r.status)};
    if(r.status===401 || (r.status===400 && /API key/i.test(lastErr.message))) break;
    // model "o'ylash" sozlamasini qo'llamasa — o'sha modelni sozlamasiz qayta sinaymiz
    if(r.status===400 && tc && /think/i.test(lastErr.message)){ noThink.add(model); tried.delete(model); queue.unshift(model); continue; }
    if(/no longer available|not found|not supported|deprecated/i.test(lastErr.message)){
      gone = true;
      const sug = (lastErr.message.match(/models\/(gemini-[\w.-]+)/g)||[]).map(x=>x.replace("models/","").replace(/\.+$/,"")).filter(x=>x!==model);
      queue.unshift(...sug); continue;
    }
    if(![429,403,400,500,503].includes(r.status)) break;
  }
  if(gone && !retried){ await ensureModels(true); return gemini(parts, opts, true); }
  throw lastErr;
}
function parseJSON(t){
  try{ return JSON.parse(t); }catch(e){}
  const m = String(t).match(/[\[{][\s\S]*[\]}]/); if(!m) throw {message:"Javobni o'qib bo'lmadi"};
  return JSON.parse(m[0]);
}
function errText(e){
  if(!e) return "Xatolik yuz berdi.";
  if(e.code==="nokey") return "Avval ⚙️ Sozlamalarda Gemini kalitini kiriting.";
  if(e.status===429) return "Gemini bepul limiti hozircha tugadi. Bir daqiqadan keyin yoki ertaga qayta urinib ko'ring.";
  if(e.status===400 && /API key/i.test(e.message)) return "Gemini kaliti noto'g'ri. ⚙️ Sozlamalarda tekshiring.";
  if(/no longer available|not found/i.test(e.message||"")) return "Gemini modeli yangilandi — sahifani yangilab, qayta urinib ko'ring.";
  if(e.status===403) return "Bu kalit bilan Gemini'dan foydalanishga ruxsat yo'q (hudud yoki loyiha cheklovi bo'lishi mumkin).";
  return "Xatolik: "+esc(e.message||"noma'lum");
}

 ]
}`;
const ROLE = `Sen tajribali koreys tili o'qituvchisisan. O'quvchi o'zbek (lotin yozuvi) tilida so'zlashadi, Koreyada o'qiydi va koreys tilini o'rganmoqda. Faqat JSON qaytar.`;

async function genFromWords(words, onCard){
  const prompt = `${ROLE}
Quyidagi so'zlarning har biri uchun bittadan flash-karta tayyorla. So'zlar koreyscha, o'zbekcha, ruscha yoki inglizcha bo'lishi mumkin — har doim koreyscha so'zni asos qilib ol. Tartibni saqla.
So'zlar: ${JSON.stringify(words)}
"from" maydoniga "text" yoz. Javob formati:
${SCHEMA}`;
  const j = await gemini([{text:prompt}], {onCard: onCard && (x=>{ const c=normalize({cards:[x]})[0]; if(c) onCard(c); })});
  return normalize(j);
}
async function genFromPhoto(blob, hint, onCard){
  const small = await shrink(blob, 1400, .8);
  const b64 = (await toDataURL(small)).split(",")[1];
  const prompt = `${ROLE}
Ilova qilingan rasmni ko'rib chiq.
• Agar rasmda koreyscha matn bo'lsa (kitob sahifasi, menyu, yozuv, ekran, daftar), undagi o'rganishga arziydigan so'zlarni ajratib ol: har birini lug'at shakliga keltir (조사 va qo'shimchalarsiz, fe'llar -다 bilan), takrorlanganlarini bir marta ol, juda oddiy yordamchi so'zlarni (은/는, 이/가 kabi) tashla. Eng ko'pi 20 ta. "from": "text".
• Agar rasmda matn bo'lmasa, rasmdagi asosiy narsa(lar)ni aniqla (1–5 ta) va ularning koreyscha nomini ber. "from": "object".
${hint ? `Foydalanuvchi izohi: ${hint}` : ""}
Har bir so'z uchun to'liq flash-karta tayyorla. Javob formati:
${SCHEMA}`;
  const j = await gemini([{text:prompt},{inline_data:{mime_type:"image/jpeg", data:b64}}], {onCard: onCard && (x=>{ const c=normalize({cards:[x]})[0]; if(c) onCard(c); })});
  return normalize(j);
}
function normalize(j){
  const arr = Array.isArray(j) ? j : (j.cards || []);
  return arr.filter(x=>x && x.ko).map(x=>({
    ko:String(x.ko).trim(), roman:String(x.roman||"").trim(), uz:String(x.uz||"").trim(), en:String(x.en||"").trim(),
    pos:String(x.pos||"").trim(), hanja:String(x.hanja||"").trim(), note:String(x.note||"").trim(),
    examples:(Array.isArray(x.examples)?x.examples:[]).slice(0,3).map(e=>({ko:String(e.ko||""),roman:String(e.roman||""),uz:String(e.uz||""),en:String(e.en||"")})),
    emoji:String(x.emoji||"").slice(0,8), img_query:String(x.img_query||"").trim(), from:x.from==="object"?"object":"text"
  }));
}

/* ================= spaced repetition ================= */
function schedule(c, g){
  let reps=c.reps||0, interval=c.interval||0, ease=c.ease||2.5, lapses=c.lapses||0, dueIn;
  if(g===0){ if(reps>0) lapses++; reps=0; interval=0; ease=Math.max(1.3,ease-0.2); dueIn=MIN; }
  else if(reps===0){
    if(g===1) dueIn=10*MIN;
    else if(g===2){ interval=1; reps=1; dueIn=DAY; }
    else { interval=3; reps=1; ease+=0.1; dueIn=3*DAY; }
  } else {
    if(g===1){ interval=Math.max(1,interval*1.2); ease=Math.max(1.3,ease-0.15); }
    else if(g===2) interval=Math.max(interval+1, interval*ease);
    else { interval=Math.max(interval+2, interval*ease*1.3); ease+=0.15; }
    reps++; dueIn=interval*DAY;
  }
  return {reps, interval, ease:Math.round(ease*100)/100, lapses, due:Date.now()+dueIn, last:Date.now(), _in:dueIn};
}

let session=null;
function startSession(cram){
  let q;
  if(cram) q = cards.filter(inFolder).sort(()=>Math.random()-.5).map(c=>c.id);
  else {
    const due = dueCards().sort((a,b)=>(a.due||0)-(b.due||0));
    q = [...due.filter(c=>!isNew(c)), ...due.filter(isNew).slice(0,20)].map(c=>c.id);
  }
  session={queue:q, done:0, total:q.length, cur:null, flipped:false}; next();
}
function next(){
  if(!session.queue.length){ session.cur=null; renderReview(); return; }
  session.cur={id:session.queue.shift(), dir:Math.random()<.5?"uz":"ko"}; session.flipped=false; renderReview();
}

  const c=cards.find(x=>x.id===session.cur.id); if(!c){ next(); return; }
  const left=session.queue.length+1, pct=session.done/(session.done+left)*100;
  const front = session.cur.dir==="uz"

  const prev=[0,1,2,3].map(g=>fmtIn(schedule(c,g)._in));
  el.innerHTML=`
    <div class="review-top"><span>${session.done} ta tayyor</span><div class="bar"><i style="width:${pct}%"></i></div><span>${left} ta qoldi</span></div>
    <div class="flip ${session.flipped?"flipped":""}" id="flip"><div class="inner">

      <p>Bu so'zni eslash qanchalik oson bo'ldi?</p>
      <div class="g">
        <button class="g0" data-g="0">Eslay olmadim<small>${prev[0]}</small></button>
        <button class="g1" data-g="1">Qiyin<small>${prev[1]}</small></button>

        <button class="g3" data-g="3">Oson<small>${prev[3]}</small></button>

    </div>`;
  $("#flip").onclick=()=>{ if(session.flipped) return; session.flipped=true; $("#flip").classList.add("flipped"); $("#grades").classList.remove("hidden"); };
  el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>rate(c,+b.dataset.g));
}
async function rate(c,g){
  logAnswer("w", g>=1, c.ko, g);
  const {_in, ...upd}=schedule(c,g); Object.assign(c,upd);
  session.done++; if(_in<=20*MIN) session.queue.push(c.id);
  next(); renderFolders();
  try{ await persist(c); }catch(e){ notice("Natijani saqlab bo'lmadi."); }
}
document.addEventListener("keydown", e=>{

});

  }
  const c=pr.list[pr.i];

      <div class="fb" id="fb"></div>

    const inp=$("#ans"); inp.focus();
    const norm=s=>String(s).normalize("NFC").replace(/[\s.,!?~·]/g,"");
    const finish=ok=>{
      pr.answered=true; logAnswer("wp", ok, c.ko); if(ok) pr.score++; else markWrong(c);
      $("#fb").className="fb "+(ok?"ok":"no");
      $("#fb").innerHTML= ok?`To'g'ri! ${esc(c.ko)} ${spk(c.ko)}`:`To'g'ri javob: <span class="ko">${esc(c.ko)}</span> (${esc(c.roman)}) ${spk(c.ko)}`;

  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    if(pr.answered) return; pr.answered=true;
    const ok=b.dataset.o===c.id; logAnswer("wp", ok, c.ko); if(ok) pr.score++; else { b.classList.add("wrong"); markWrong(c); }

    $("#fb").innerHTML= ok?"To'g'ri! 👏":`To'g'ri javob: <span class="ko">${esc(c.ko)}</span> — ${esc(c.uz)}`;
    $("#nx").classList.remove("hidden"); speak(c.ko);
  });
  $("#nextQ").onclick=()=>{pr.i++;pr.answered=false;renderPractice();};

async function fillEnglish(){
  const need = cards.filter(c=>!c.en || (c.examples||[]).some(e=>e.ko && !e.en));
  if(!need.length || !settings.key){ if(!settings.key) openSettings(); return; }
  const box=$("#enFill"); let done=0;
  for(let i=0;i<need.length;i+=25){
    const part=need.slice(i,i+25);
    box.innerHTML=`<div class="status"><span class="spinner"></span> Inglizcha tarjimalar qo'shilmoqda… ${done}/${need.length}</div>`;
    try{
      const j = await gemini([{text:`Quyidagi koreyscha so'zlar va misol gaplarni inglizchaga tarjima qil. O'zbekcha tarjima ma'noni aniqlash uchun berilgan. Faqat JSON qaytar.
${JSON.stringify(part.map(c=>({id:c.id, ko:c.ko, uz:c.uz, examples:(c.examples||[]).map(e=>e.ko)})))}
Format: {"items":[{"id":"…","en":"so'z tarjimasi (1–3 ma'no, vergul bilan)","examples":["1-gap tarjimasi","2-gap tarjimasi"]}]}`}]);
      for(const it of (j.items||[])){
        const c=cards.find(x=>x.id===it.id); if(!c) continue;
        if(it.en) c.en=String(it.en).trim();
        (c.examples||[]).forEach((e,k)=>{ if(it.examples && it.examples[k]) e.en=String(it.examples[k]).trim(); });
      }
      await persistMany(part.filter(c=>c.en)); done+=part.length;
    }catch(e){ box.innerHTML=`<div class="status err">${errText(e)}</div>`; renderLibrary(); return; }
  }
  box.innerHTML=`<div class="status">✓ ${done} ta kartaga inglizcha tarjima qo'shildi.</div>`; renderLibrary();
}
function renderLibrary(){
  const lack = cards.filter(c=>!c.en).length, fb=$("#enFill");
  if(fb && !fb.querySelector(".spinner")) fb.innerHTML = lack ? `<div class="en-fill"><span>🇬🇧 ${lack} ta kartada inglizcha tarjima yo'q.</span><button class="btn sm blue" id="enBtn">Qo'shish (${Math.ceil(lack/25)} ta so'rov)</button></div>` : (fb.querySelector(".status")?fb.innerHTML:"");
  const eb=$("#enBtn"); if(eb) eb.onclick=fillEnglish;

  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); if(!Array.isArray(d.cards)) throw 0;
    for(const fo of (d.folders||[])) if(!folders.find(x=>x.id===fo.id)) folders.push({...fo, mod:Date.now()});
    await saveFolders();
    const ids=new Set(cards.map(c=>c.id)); const add=d.cards.filter(c=>c&&c.id&&c.ko);
    await persistMany(add);
    add.forEach(c=>{ if(ids.has(c.id)) cards[cards.findIndex(x=>x.id===c.id)]=c; else cards.push(c); });
    const gAdd=(Array.isArray(d.grammar)?d.grammar:[]).filter(g=>g&&g.id&&g.title);
    for(const g of gAdd) await persistGram(g);
    renderAll(); const s=$("#bkStatus"); if(s) s.textContent=`✓ ${add.length} ta karta${gAdd.length?` va ${gAdd.length} ta grammatika`:""} tiklandi.`;
  }catch(err){ const s=$("#bkStatus"); if(s){ s.className="status err"; s.textContent="Bu fayl zaxira nusxa emas."; } }
};

async function persistGram(g){ stamp(g); const i=grams.findIndex(x=>x.id===g.id); if(i>=0) grams[i]=g; else grams.push(g); await idb.gPut(g); scheduleSync(); }
async function removeGram(id){ const t=(await idb.get("gdeleted"))||{}; t[id]=Date.now(); await idb.set("gdeleted",t); await idb.gDel(id); grams=grams.filter(x=>x.id!==id); scheduleSync(); }
const gDue = () => grams.filter(g=>(g.due||0)<=Date.now());

const GSCHEMA = `{
 "title": "grammatika nomi koreyscha shaklda, masalan -(으)ㄹ 때 yoki -고 싶다",
 "name_uz": "qisqa o'zbekcha nomi, masalan «…ganda, …gan paytda»",

}`;
async function genGrammar(topic, question, img){
  const parts = [{text:`Sen koreys tili grammatikasini o'zbek o'quvchilarga tushuntiradigan tajribali o'qituvchisan. Faqat JSON qaytar.
O'quvchi Koreyada o'qiydi, koreys tilini o'rganmoqda va o'zbek tilida (lotin yozuvi) so'zlashadi.
Mavzu: ${topic ? JSON.stringify(topic) : "(yozilmagan — rasmdan aniqla)"}
O'quvchi nimani tushunmoqchi: ${question ? JSON.stringify(question) : "(yozilmagan — umumiy tushuntir)"}
${img ? "Ilova qilingan rasm — darslik yoki dars materialidan skrinshot. Undagi grammatika qoidasini o'qib, shu asosda tushuntir." : ""}
Talablar: examples — 4 ta; mistakes — 2–3 ta; quiz — 4 ta, har birida options aynan 4 ta va ulardan biri answer bilan bir xil. Faqat to'g'ri, tabiiy koreys tilidan foydalan (해요체).
Javob formati:
${GSCHEMA}`}];
  if(img){ const small = await shrink(img, 1400, .8); parts.push({inline_data:{mime_type:"image/jpeg", data:(await toDataURL(small)).split(",")[1]}}); }
  const j = await gemini(parts);
  return normGram(j);
}
function normGram(j){
  const S = v => String(v||"").trim(), A = v => Array.isArray(v) ? v : [];
  const quiz = A(j.quiz).map(q=>{
    const answer=S(q.answer); let options=[...new Set(A(q.options).map(S).filter(Boolean))];
    if(!options.includes(answer)) options.unshift(answer);
    return {sentence:S(q.sentence), base:S(q.base), answer, options:options.slice(0,4), uz:S(q.uz)};
  }).filter(q=>q.sentence.includes("___") && q.answer);
  return { title:S(j.title)||"Grammatika", name_uz:S(j.name_uz), level:S(j.level), meaning:S(j.meaning),
    form:A(j.form).map(S).filter(Boolean), explanation:S(j.explanation),
    examples:A(j.examples).map(e=>({ko:S(e.ko),roman:S(e.roman),uz:S(e.uz),en:S(e.en)})).filter(e=>e.ko).slice(0,6),
    mistakes:A(j.mistakes).map(S).filter(Boolean), compare:S(j.compare), quiz };
}
async function askFollowUp(g, q){
  const brief = {title:g.title, meaning:g.meaning, form:g.form, explanation:g.explanation, examples:g.examples.slice(0,3)};
  const j = await gemini([{text:`Sen koreys tili o'qituvchisisan. O'quvchi o'zbek tilida so'zlashadi. Faqat JSON qaytar.
Mavzu bo'yicha avval berilgan tushuntirish: ${JSON.stringify(brief)}
O'quvchining qo'shimcha savoli: ${JSON.stringify(q)}
Qisqa va aniq javob ber (o'zbekcha, 2–6 gap), kerak bo'lsa 1–2 ta misol bilan.
Format: {"answer":"…","examples":[{"ko":"…","roman":"…","uz":"…","en":"…"}]}`}]);
  return {q, a:String(j.answer||"").trim(), examples:(Array.isArray(j.examples)?j.examples:[]).slice(0,3).map(e=>({ko:String(e.ko||""),roman:String(e.roman||""),uz:String(e.uz||""),en:String(e.en||"")})), at:Date.now()};
}

/* takrorlash */
function startGReview(){
  const q = gDue().sort((a,b)=>(a.due||0)-(b.due||0)).map(g=>g.id);
  gSession = {queue:q, done:0, cur:null, flipped:false}; nextG();
}
function nextG(){
  if(!gSession.queue.length){ gSession.cur=null; renderGReview(); return; }
  const id=gSession.queue.shift(), g=grams.find(x=>x.id===id);
  const mode = g && (g.quiz||[]).length && Math.random()<.5 ? "quiz" : "title";
  gSession.cur={id, mode, qi: g && g.quiz && g.quiz.length ? Math.floor(Math.random()*g.quiz.length) : 0}; gSession.flipped=false; renderGReview();
}
function renderGReview(){
  const el=$("#tab-grammar");
  if(!gSession.cur){
    el.innerHTML=`<div class="panel empty"><div class="e">🎉</div><h3>Grammatika takrorlandi</h3><p class="muted">${gSession.done} ta mavzu ko'rib chiqildi.</p><button class="btn" id="gFin" style="margin-top:8px">Yopish</button></div>`;
    $("#gFin").onclick=()=>{ gSession=null; renderGrammar(); }; return;
  }
  const g=grams.find(x=>x.id===gSession.cur.id); if(!g){ nextG(); return; }
  const left=gSession.queue.length+1, pct=gSession.done/(gSession.done+left)*100;
  const qz = gSession.cur.mode==="quiz" ? g.quiz[gSession.cur.qi] : null;
  const front = qz
    ? `<div class="dir">GAPNI TO'LDIRING</div><div class="g-front-s ko">${esc(qz.sentence).replace("___",'<span class="blank">___</span>')}</div>${qz.base?`<div class="muted ko">(${esc(qz.base)})</div>`:""}<div class="muted" style="font-size:13px">${esc(qz.uz)}</div>`
    : `<div class="dir">QOIDANI ESLANG</div><div class="g-front-t ko">${esc(g.title)}</div><div class="muted">Ma'nosi nima va qanday qo'shiladi?</div>`;
  const prev=[0,1,2,3].map(n=>fmtIn(schedule(g,n)._in));
  el.innerHTML=`
    <div class="review-top"><span>${gSession.done} ta tayyor</span><div class="bar"><i style="width:${pct}%"></i></div><span>${left} ta qoldi</span></div>
    <div class="flip ${gSession.flipped?"flipped":""}" id="gFlip"><div class="inner">
      <div class="face front">${front}<div class="tap">Javobni ko'rish uchun bosing</div></div>
      <div class="face back">${qz?`<div class="g-ans ko">${esc(qz.sentence).replace("___",`<b>${esc(qz.answer)}</b>`)} ${spk(qz.sentence.replace("___",qz.answer))}</div>`:""}${gramBody(g,false)}</div>
    </div></div>
    <div class="grades ${gSession.flipped?"":"hidden"}" id="gGrades">
      <p>Bu qoidani eslash qanchalik oson bo'ldi?</p>
      <div class="g"><button class="g0" data-gg="0">Eslay olmadim<small>${prev[0]}</small></button><button class="g1" data-gg="1">Qiyin<small>${prev[1]}</small></button><button class="g2" data-gg="2">Yaxshi<small>${prev[2]}</small></button><button class="g3" data-gg="3">Oson<small>${prev[3]}</small></button></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="gStop">Tugatish</button></div>`;
  $("#gFlip").onclick=()=>{ if(gSession.flipped) return; gSession.flipped=true; $("#gFlip").classList.add("flipped"); $("#gGrades").classList.remove("hidden"); };
  $("#gStop").onclick=()=>{ gSession=null; renderGrammar(); };
  el.querySelectorAll("[data-gg]").forEach(b=>b.onclick=async()=>{
    logAnswer("g", +b.dataset.gg>=1, g.title, +b.dataset.gg);
    const {_in,...upd}=schedule(g,+b.dataset.gg); Object.assign(g,upd); gSession.done++;
    if(_in<=20*MIN) gSession.queue.push(g.id);
    nextG(); try{ await persistGram(g); }catch(e){} updGBadge();
  });
}

/* mashq: bo'sh joyni to'ldirish */
function startGPractice(){
  const pool=[]; grams.forEach(g=>(g.quiz||[]).forEach(q=>pool.push({g,q})));
  const e=LS.get("gErr",{});
  const list=shuffle(pool).sort((a,b)=>(e[b.g.id]||0)-(e[a.g.id]||0)).slice(0,10);
  gPr={list:shuffle(list), i:0, ok:0, combo:0, answered:false};
  renderGPractice();
}
function renderGPractice(){
  const el=$("#tab-grammar");

function sinoSmall(n){
  let s=""; for(const [v,w] of [[1000,"천"],[100,"백"],[10,"십"]]){ const d=Math.floor(n/v)%10; if(d) s+=(d===1?"":SD[d-1])+w; }
  const d=n%10; if(d) s+=SD[d-1]; return s;
}
function sino(n){ if(n===0) return "영"; const man=Math.floor(n/10000), r=n%10000; return (man?(man===1?"":sinoSmall(man))+"만":"")+sinoSmall(r); }
const NU=["","하나","둘","셋","넷","다섯","여섯","일곱","여덟","아홉"], NUA=["","한","두","세","네","다섯","여섯","일곱","여덟","아홉"];
const NT=["","열","스물","서른","마흔","쉰","예순","일흔","여든","아흔"];
function native(n, attr){ const t=Math.floor(n/10), u=n%10; const tens=(attr&&t===2&&u===0)?"스무":NT[t]; return tens+(attr?NUA[u]:NU[u]); }
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function sinoWord(ctx, n){ return ctx.id==="wol" ? (n===6?"유월":n===10?"시월":sino(n)+"월") : `${sino(n)} ${ctx.c}`; }
function nativeWord(ctx, n){ return `${native(n,true)} ${ctx.c}`; }
function makeItem(ctx){
  if(ctx.id==="time"){
    const h=rnd(1,12), m=pick([5,10,15,20,25,30,35,40,45,50,55]);
    return {ctx, n:h, text:`${h}시 ${m}분`, uz:`soat ${h}:${String(m).padStart(2,"0")}`,
      read:`${native(h,true)} 시 ${sino(m)} 분`, wrong:`${sino(h)} 시 ${native(m,true)} 분`,
      extra:[`${native(h,true)} 시 ${native(m,true)} 분`, `${sino(h)} 시 ${sino(m)} 분`]};
  }
  const n = ctx.gen ? ctx.gen() : rnd(ctx.r[0], ctx.r[1]);
  const text = ctx.id==="wol" ? `${n}월` : `${n}${ctx.c.startsWith("번 ")?"번 버스":ctx.c}`;
  const read = ctx.sys==="n" ? nativeWord(ctx,n) : sinoWord(ctx,n);
  const wrong = ctx.sys==="n" ? sinoWord(ctx,n) : (n<=99 ? nativeWord(ctx,n) : null);
  const extra = [];
  if(ctx.sys==="n" && native(n,true)!==native(n,false)) extra.push(`${native(n,false)} ${ctx.c}`);   // 하나 살 xatosi
  if(ctx.id==="wol" && (n===6||n===10)) extra.push(n===6?"육월":"십월");
  const n2 = n + (Math.random()<.5?1:-1);
  if(n2>0) extra.push(ctx.sys==="n" && n2<=99 ? nativeWord(ctx,n2) : sinoWord(ctx,n2));
  return {ctx, n, text, uz:ctx.uz(n), read, wrong, extra};
}

function pickCtx(filter){
  const list = CTX.filter(filter||(()=>true)), e=errW();
  const w = list.map(c=>1+Math.min(6,(e[c.id]||0)*2)); let t=w.reduce((a,b)=>a+b,0)*Math.random();
  for(let i=0;i<list.length;i++){ t-=w[i]; if(t<=0) return list[i]; } return list[list.length-1];
}

let actx=null;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [[880,0],[1320,.09]] : [[220,0],[180,.12]];
    for(const [f,t] of notes){
      const o=actx.createOscillator(), g=actx.createGain(); o.type=ok?"sine":"square"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(ok?.18:.06, actx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+t+.22);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.25);
    }
  }catch(e){}
}

function makeQ(type){
  if(type==="mix") type = pick(SR ? ["sys","read","read","listen","type","speak"] : ["sys","read","read","listen","type"]);
  if(type==="listen"){ const ctx=pickCtx(c=>c.sys!=="m" && c.id!=="nyeon"); return {type, it:makeItem(ctx)}; }
  if(type==="type"){
    const sys = Math.random()<.5?"n":"s", n=rnd(1,99);
    return {type, sys, n, answer: sys==="n"?native(n,false):sino(n), alt: sys==="n"?native(n,true):null};
  }
  const ctx = pickCtx(type==="sys" ? (c=>c.sys!=="m") : null);
  const it = makeItem(ctx);
  if(type==="read"){
    const opts=[it.read]; for(const o of [it.wrong, ...shuffle(it.extra)]) if(o && !opts.includes(o) && opts.length<4) opts.push(o);
    while(opts.length<3){ const o=makeItem(ctx).read; if(!opts.includes(o)) opts.push(o); }
    return {type, it, opts:shuffle(opts)};
  }
  return {type, it};
}

let rec=null;
function listenSpeech(q){
  if(!SR || nl.answered) return;
  try{ rec && rec.abort(); }catch(e){}
  rec = new SR(); rec.lang="ko-KR"; rec.interimResults=false; rec.maxAlternatives=5;
  const mic=$("#mic"), hint=$("#micHint");
  mic.classList.add("on"); hint.textContent="Eshityapman… gapiring";
  rec.onresult = ev => {
    const alts=[...ev.results[0]].map(a=>a.transcript.trim());
    const fa=alts.map(flat), heard=alts[0];
    const good=flat(q.it.read), bad=q.it.wrong?flat(q.it.wrong):null, digits=flat(q.it.text);
    if(fa.includes(good)) answer(q, true, `Eshitildi: «${heard}»`);
    else if(bad && fa.includes(bad)) answer(q, false, `Eshitildi: «${heard}» — bu boshqa tizim.`);
    else if(fa.includes(digits)) answer(q, true, `Eshitildi: «${heard}». Tanib olish tizimi raqam bilan yozgani uchun qaysi tizimda aytganingizni aniq tekshirib bo'lmadi.`, true);
    else answer(q, false, `Eshitildi: «${heard}»`);
  };
  rec.onerror = e => { mic.classList.remove("on");
    hint.textContent = e.error==="not-allowed"||e.error==="service-not-allowed" ? "Mikrofonga ruxsat berilmagan. Brauzer sozlamalaridan ruxsat bering." : e.error==="no-speech" ? "Ovoz eshitilmadi. Qayta bosib, gapiring." : "Tanib bo'lmadi, qayta urinib ko'ring."; };
  rec.onend = () => mic.classList.remove("on");
  try{ rec.start(); }catch(e){ hint.textContent="Mikrofonni ishga tushirib bo'lmadi."; }
}
function answer(q, ok, heardNote, soft){
  nl.answered=true; beep(ok); logAnswer("n", ok, q.it ? q.it.text : `${q.n} (${q.sys==="n"?"koreyscha":"xitoycha"})`);
  if(ok){ nl.ok++; nl.combo++; nl.best=Math.max(nl.best,nl.combo); nl.xp += 10 + (nl.combo>=3?5:0); if(q.it) bumpErr(q.it.ctx.id,-.5); }
  else { nl.combo=0; if(q.it){ bumpErr(q.it.ctx.id,1); nl.wrongs.push(q.it.ctx.id); } }
  let correct, rule="";
  if(q.type==="type"){ correct = q.answer + (q.alt && q.alt!==q.answer ? ` (so'z oldida: ${q.alt})` : ""); rule = q.sys==="n"?"Koreyscha sanoq: 하나, 둘, 셋… 아흔아홉 (1–99).":"Xitoycha sanoq: 일, 이, 삼… 십, 백, 천, 만."; }
  else { correct = q.it.read; rule = q.it.ctx.rule; }
  const sayText = q.type==="type" ? q.answer : q.it.read;
  $("#fbBar").innerHTML = `<div class="fb-bar ${ok?"ok":"no"}">
    <div class="fb-h">${ok?(soft?"✓ Qabul qilindi":pick(["To'g'ri! 👏","Barakalla! 🎉","Zo'r! ✨","Aynan! 💯"])):"Noto'g'ri"}</div>
    ${heardNote?`<div class="fb-s">${esc(heardNote)}</div>`:""}
    <div class="fb-c"><span class="ko">${q.type==="type"?"":esc(q.it.text)+" → "}<b>${esc(correct)}</b></span> ${spk(sayText)}</div>
    <div class="fb-s">💡 ${esc(rule)}</div>
    <button class="btn ${ok?"green":"primary"}" id="nNext">Davom etish</button></div>`;
  $("#nNext").onclick=nextNum; $("#nNext").focus();
  if(q.type!=="listen") setTimeout(()=>speak(sayText),150);
  const top=$(".lesson-top .combo"); if(top){ top.textContent="🔥 "+nl.combo; top.classList.toggle("hot",nl.combo>=3); }
}

async function gfetch(url, opts={}){
  const r = await fetch(url, {...opts, headers:{...(opts.headers||{}), Authorization:"Bearer "+gToken}});
  if(r.status===401){ gToken=null; throw {code:"auth"}; }
  if(!r.ok) throw {status:r.status, message:(await r.text()).slice(0,200)};
  return r;
}
async function driveList(){
  const out = {}; let page = "";
  do{
    const r = await gfetch(`${DRIVE}/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)${page?"&pageToken="+encodeURIComponent(page):""}`);
    const j = await r.json(); (j.files||[]).forEach(f=>{ out[f.name]=f.id; }); page = j.nextPageToken||"";
  } while(page);
  return out;
}
async function driveCreate(name, blob){
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify({name, parents:["appDataFolder"]})], {type:"application/json"}));
  fd.append("file", blob);
  const r = await gfetch(`${UPLOAD}/files?uploadType=multipart&fields=id`, {method:"POST", body:fd});
  return (await r.json()).id;
}
const driveUpdate = (id, blob) => gfetch(`${UPLOAD}/files/${id}?uploadType=media`, {method:"PATCH", body:blob});
const driveGet = id => gfetch(`${DRIVE}/files/${id}?alt=media`);
const driveDel = id => gfetch(`${DRIVE}/files/${id}`, {method:"DELETE"}).catch(()=>{});

function forCloud(c){ const o={...c}; if(o.img && o.img.startsWith("data:")) o.img=null; return o; }
function mergeTomb(a={}, b={}){ const o={...a}; for(const k in b) o[k]=Math.max(o[k]||0, b[k]); return o; }
function mergeById(local, remote, tomb){
  const m = new Map();
  for(const x of remote) m.set(x.id, {item:x, from:"r"});
  for(const x of local){ const r=m.get(x.id); if(!r || (x.mod||0) >= (r.item.mod||0)) m.set(x.id, {item:x, from:"l"}); }
  return [...m.values()].filter(v => !(tomb[v.item.id] && tomb[v.item.id] >= (v.item.mod||0)));
}

async function syncNow(){
  if(!tokenOk()){ if(LS.get("gsign",false)) cloudState("need"); return; }
  if(syncing){ syncAgain=true; return; }
  syncing=true; cloudState("sync");
  try{
    const files = await driveList();
    let remote = {cards:[], grammar:[], folders:[], deleted:{}, fdeleted:{}, gdeleted:{}, settings:{}}, remoteText = "";
    if(files[DATA_FILE]){ remoteText = await (await driveGet(files[DATA_FILE])).text(); try{ remote = {...remote, ...JSON.parse(remoteText)}; }catch(e){} }

    const deleted = mergeTomb((await idb.get("deleted"))||{}, remote.deleted);
    const fdeleted = mergeTomb((await idb.get("fdeleted"))||{}, remote.fdeleted);

    // kartalar va grammatika
    async function mergeSet(local, remoteList, tomb, put, del){
      const byL = new Map(local.map(c=>[c.id,c]));
      const next = [], changed = [];
      for(const {item, from} of mergeById(local, remoteList||[], tomb)){
        if(from==="l"){ next.push(item); continue; }
        const loc = byL.get(item.id), c = {...item};
        if(c.imgName && loc && loc.imgName===c.imgName && loc.img) c.img = loc.img;   // rasm o'zgarmagan
        next.push(c); changed.push(c);
      }
      for(const c of next){
        if(c.imgName && !(c.img && c.img.startsWith("data:")) && files[c.imgName]){
          try{ c.img = await toDataURL(new Blob([await (await driveGet(files[c.imgName])).blob()], {type:"image/jpeg"})); if(!changed.includes(c)) changed.push(c); }catch(e){}
        }
      }
      if(changed.length) await put(changed);                 // mod o'zgarmaydi
      for(const c of local) if(!next.find(n=>n.id===c.id)) await del(c.id);
      return next;
    }
    const gdeleted = mergeTomb((await idb.get("gdeleted"))||{}, remote.gdeleted);
    cards = await mergeSet(cards, remote.cards, deleted, idb.putMany, idb.del);
    grams = await mergeSet(grams, remote.grammar, gdeleted, idb.gPutMany, idb.gDel);
    await idb.set("deleted", deleted); await idb.set("gdeleted", gdeleted);

    // papkalar
    folders = mergeById(folders, remote.folders||[], fdeleted).map(v=>v.item);
    await idb.set("folders", folders); await idb.set("fdeleted", fdeleted);

    // Gemini kaliti (faqat sizning Drive'ingizdagi yashirin papkada)

    if(rs.key && (!settings.key || (rs.keyMod||0) > LS.get("keyMod",0))){ settings.key=rs.key; LS.set("key",rs.key); LS.set("keyMod",rs.keyMod||0); notice(""); ensureModels(true); }

    // rasmlarni yuklash
    for(const c of [...cards, ...grams]){
      if(c.imgName && c.img && c.img.startsWith("data:") && !files[c.imgName]){
        const blob = await (await fetch(c.img)).blob();
        files[c.imgName] = await driveCreate(c.imgName, blob);
      }
    }
    // ma'lumot fayli
    const data = {app:"danEo-cards", v:3, cards:cards.map(forCloud), grammar:grams.map(forCloud), folders, deleted, fdeleted, gdeleted,
                  stats: {...statsAll, [devId]: statDays},

    }

    writeSheet(false).catch(()=>{});
  }catch(e){
    if(e && e.code==="auth") cloudState("need");
    else cloudState("err", "Sinxronlashda xato: " + (e && (e.message||e.status) || "aloqa yo'q"));

  }

}
const sumDay = d => { let n=0,ok=0; for(const k in d) if(k!=="new"){ n+=d[k][0]; ok+=d[k][1]; } return [n,ok]; };
function rangeSum(days, from, to){ let n=0,ok=0,nw=0; for(let i=from;i<to;i++){ const d=days[dayKey(Date.now()-i*DAY)]; if(d){ const [a,b]=sumDay(d); n+=a; ok+=b; nw+=d.new||0; } } return {n,ok,nw,acc:n?Math.round(ok/n*100):null}; }
function streakDays(days){ let s=0; let i = days[dayKey()] ? 0 : 1; for(;;i++){ const d=days[dayKey(Date.now()-i*DAY)]; if(d && sumDay(d)[0]) s++; else break; } return s; }
function stageOf(c){ if(!c.reps && !c.last) return "new"; const iv=c.interval||0; if(iv<7) return "learn"; if(iv<21) return "young"; return "mature"; }
const STAGE_UZ = {new:"Yangi", learn:"O'rganilmoqda", young:"Mustahkamlanmoqda", mature:"O'zlashtirilgan"};

function openStats(){
  const days=mergedDays(), t=rangeSum(days,0,1), w=rangeSum(days,0,7), pw=rangeSum(days,7,14), m=rangeSum(days,0,30);
  const st={new:0,learn:0,young:0,mature:0}; cards.forEach(c=>st[stageOf(c)]++);
  const gst={new:0,learn:0,young:0,mature:0}; grams.forEach(g=>gst[stageOf(g)]++);
  const hard=[...cards].filter(c=>(c.lapses||0)>0).sort((a,b)=>(b.lapses||0)-(a.lapses||0)).slice(0,6);
  const byKind={}; for(let i=0;i<30;i++){ const d=days[dayKey(Date.now()-i*DAY)]; if(d) for(const k in d) if(k!=="new"){ const a=byKind[k]||(byKind[k]=[0,0]); a[0]+=d[k][0]; a[1]+=d[k][1]; } }
  const trend = (w.acc!=null && pw.acc!=null) ? w.acc-pw.acc : null;
  // 14 kunlik diagramma
  const bars=[]; let mx=1; for(let i=13;i>=0;i--){ const d=days[dayKey(Date.now()-i*DAY)]||{}; const [n,ok]=sumDay(d); mx=Math.max(mx,n); bars.push({i,n,ok,lbl:new Date(Date.now()-i*DAY).getDate()}); }
  const W=320,H=120,bw=W/14;
  const svg=`<svg viewBox="0 0 ${W} ${H+16}" class="chart">${bars.map((b,k)=>{ const h=b.n/mx*H, ho=b.ok/mx*H, x=k*bw+3;
    return `<rect x="${x}" y="${H-h}" width="${bw-6}" height="${h}" rx="3" fill="#f2c9bf"><title>${b.n} ta javob, ${b.ok} ta to'g'ri</title></rect><rect x="${x}" y="${H-ho}" width="${bw-6}" height="${ho}" rx="3" fill="#2f7d4f"/><text x="${x+(bw-6)/2}" y="${H+12}" text-anchor="middle" font-size="9" fill="#7b736a">${b.lbl}</text>`; }).join("")}</svg>`;
  const total=cards.length||1;
  const nx = LS.get("numXP",0), nerr=errW(), weakNum=CTX.filter(c=>(nerr[c.id]||0)>=1).sort((a,b)=>nerr[b.id]-nerr[a.id]).slice(0,3);
  $("#modalBox").innerHTML=`<button class="iconbtn x" id="mx">✕</button>
    <h3 style="margin:0 0 12px">📊 Statistika</h3>
    <div class="kpis">
      <div><b>🔥 ${streakDays(days)}</b><small>kun ketma-ket</small></div>
      <div><b>${t.n}</b><small>bugungi javob</small></div>
      <div><b>${w.acc==null?"—":w.acc+"%"}</b><small>7 kunlik aniqlik${trend==null?"":` <span class="${trend>=0?"up":"down"}">${trend>=0?"▲":"▼"} ${Math.abs(trend)}</span>`}</small></div>
      <div><b>${st.mature}</b><small>o'zlashtirilgan so'z</small></div>
    </div>
    <div class="sec-t">Oxirgi 14 kun</div>${svg}
    <div class="legend"><span><i style="background:#2f7d4f"></i>to'g'ri</span><span><i style="background:#f2c9bf"></i>xato</span></div>
    <div class="sec-t">So'zlar holati (${cards.length} ta)</div>
    <div class="stack">${["new","learn","young","mature"].map(k=>`<i class="s-${k}" style="width:${st[k]/total*100}%"></i>`).join("")}</div>
    <div class="legend">${["new","learn","young","mature"].map(k=>`<span><i class="s-${k}"></i>${STAGE_UZ[k]}: <b>${st[k]}</b></span>`).join("")}</div>
    <div class="muted" style="font-size:12px;margin-top:4px">O'zlashtirilgan — keyingi takrori 3 haftadan keyin bo'lgan so'zlar.</div>
    <div class="sec-t">30 kun bo'limlar bo'yicha</div>
    ${Object.keys(byKind).length?Object.entries(byKind).map(([k,a])=>`<div class="krow"><span>${KIND[k]||k}</span><span class="muted">${a[0]} ta</span><div class="kbar"><i style="width:${Math.round(a[1]/a[0]*100)}%"></i></div><b>${Math.round(a[1]/a[0]*100)}%</b></div>`).join(""):`<div class="muted" style="font-size:13px">Hali javoblar yo'q — takrorlash yoki mashqni boshlang.</div>`}
    <div class="sec-t">Umumiy</div>
    <div class="muted" style="font-size:13.5px;line-height:1.7">30 kunda: <b>${m.n}</b> ta javob, aniqlik <b>${m.acc==null?"—":m.acc+"%"}</b>, <b>${m.nw}</b> ta yangi so'z qo'shildi<br>Grammatika: <b>${grams.length}</b> ta mavzu, ${gst.mature} tasi o'zlashtirilgan<br>Sonlar: <b>${nx}</b> XP${weakNum.length?` · qiyinlari: ${weakNum.map(c=>esc(c.c||"vaqt")).join(", ")}`:""}</div>
    ${hard.length?`<div class="sec-t">Eng qiyin so'zlar</div><div class="row">${hard.map(c=>`<span class="tag dup ko" style="font-size:13px">${esc(c.ko)} · ${c.lapses}×</span>`).join("")}</div>`:""}
    <div class="sec-t">Google Sheets</div>
    ${sheetBlock()}`;
  $("#modal").classList.add("on"); $("#mx").onclick=closeModal; wireSheetBlock(openStats);
}

/* --- Google Sheets --- */
const SHEETS = "https://sheets.googleapis.com/v4/spreadsheets";
const sheetId = () => LS.get("sheetId","");
const sheetUrl = () => `https://docs.google.com/spreadsheets/d/${sheetId()}/edit`;
function sheetBlock(){
  if(!GOOGLE_CLIENT_ID) return `<div class="muted" style="font-size:13px">Google sinxronlash sozlanmagan.</div>`;
  if(!LS.get("gsign",false)) return `<div class="muted" style="font-size:13px">Avval ☁️ orqali Google hisobingiz bilan kiring.</div>`;
  if(!sheetId()) return `<p class="muted" style="font-size:13px;margin:0 0 8px">Natijalaringiz Google Drive'ingizdagi alohida jadvalga yozib boriladi: kunlik statistika, har bir javob, so'zlar ro'yxati va grafik.</p>
    <button class="btn blue" id="shCreate">📊 Jadval yaratish</button><div class="status" id="shSt"></div>`;
  const last=LS.get("sheetAt",0);
  return `<div class="row"><a class="btn sm blue" href="${sheetUrl()}" target="_blank" rel="noopener">📊 Jadvalni ochish</a><button class="btn sm" id="shNow">↻ Hozir yangilash</button></div>
    <div class="status" id="shSt">${last?"Oxirgi yozilgan: "+new Date(last).toLocaleString():""}${sheetQ.length?` · navbatda ${sheetQ.length} ta javob`:""}</div>`;
}
function wireSheetBlock(rerender){
  const c=$("#shCreate"); if(c) c.onclick=async()=>{ const s=$("#shSt"); s.className="status"; s.innerHTML='<span class="spinner"></span> Jadval yaratilmoqda…';
    try{ await createSheet(); await writeSheet(true); rerender(); }catch(e){ s.className="status err"; s.innerHTML=sheetErr(e); } };
  const n=$("#shNow"); if(n) n.onclick=async()=>{ const s=$("#shSt"); s.className="status"; s.innerHTML='<span class="spinner"></span> Yozilmoqda…';
    try{ await writeSheet(true); rerender(); }catch(e){ s.className="status err"; s.innerHTML=sheetErr(e); } };
}
function sheetErr(e){
  if(e && e.code==="scope") return "Jadvalga yozish uchun Google ruxsati kerak. Ochilgan oynada «Google Drive'dagi shu ilova yaratgan fayllar» ga belgi qo'ying va qayta bosing.";
  if(e && e.code==="auth") return "Google'ga qayta kiring (☁️ tugmasi) va yana urinib ko'ring.";
  if(e && e.status===403 && /has not been used|disabled|SERVICE_DISABLED/i.test(e.message||"")) return "Google Cloud'da <b>Google Sheets API</b> yoqilmagan. console.cloud.google.com → qidiruvga «Google Sheets API» → <b>Enable</b>, keyin 1–2 daqiqa kutib qayta bosing.";
  return "Xatolik: "+esc((e&&(e.message||e.status))||"noma'lum");
}
async function sfetch(url, opts={}){
  if(!tokenOk()) throw {code:"auth"};
  if(!LS.get("scopeFile",false)) throw {code:"scope"};
  const r = await fetch(url, {...opts, headers:{"Content-Type":"application/json", ...(opts.headers||{}), Authorization:"Bearer "+gToken}});
  if(r.status===401){ gToken=null; throw {code:"auth"}; }
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw {status:r.status, message:(j.error&&j.error.message)||("HTTP "+r.status)};
  return j;
}
const ensureFileScope = () => { if(!LS.get("scopeFile",false)){ tokenClient && tokenClient.requestAccessToken({prompt:"consent", scope:SCOPE}); throw {code:"scope"}; } };
async function createSheet(){
  initGis(); ensureFileScope();
  const j = await sfetch(SHEETS, {method:"POST", body:JSON.stringify({
    properties:{title:"단어 — Koreys tili natijalarim", locale:"en_US"},
    sheets:["Kunlik","Javoblar","So'zlar","Grammatika"].map((t,i)=>({properties:{sheetId:i, title:t, gridProperties:{frozenRowCount:1}}}))
  })});
  LS.set("sheetId", j.spreadsheetId); LS.set("sheetMod", Date.now());
  const head = (sid, cols) => ({repeatCell:{range:{sheetId:sid,startRowIndex:0,endRowIndex:1,endColumnIndex:cols},cell:{userEnteredFormat:{textFormat:{bold:true},backgroundColor:{red:.96,green:.94,blue:.9}}},fields:"userEnteredFormat(textFormat,backgroundColor)"}});
  await sfetch(`${SHEETS}/${j.spreadsheetId}/values:batchUpdate`, {method:"POST", body:JSON.stringify({valueInputOption:"RAW", data:[
    {range:"Kunlik!A1", values:[["Sana","Jami javob","To'g'ri","Aniqlik %","So'z takrori","So'z mashqi","Grammatika","Sonlar","Yangi so'zlar"]]},
    {range:"Javoblar!A1", values:[["Sana","Vaqt","Bo'lim","Element","Natija","Baho"]]},
    {range:"So'zlar!A1", values:[["Koreyscha","O'qilishi","O'zbekcha","Inglizcha","Papka","Holati","Interval (kun)","To'g'ri","Unutilgan","Keyingi takror","Qo'shilgan"]]},
    {range:"Grammatika!A1", values:[["Mavzu","Nomi","Daraja","Holati","To'g'ri","Unutilgan","Keyingi takror"]]}]})});
  await sfetch(`${SHEETS}/${j.spreadsheetId}:batchUpdate`, {method:"POST", body:JSON.stringify({requests:[
    head(0,9), head(1,6), head(2,11), head(3,7),
    {addChart:{chart:{position:{overlayPosition:{anchorCell:{sheetId:0,rowIndex:1,columnIndex:10},widthPixels:640,heightPixels:340}},
      spec:{title:"Kunlik javoblar va aniqlik", basicChart:{chartType:"COMBO", legendPosition:"BOTTOM_LEGEND", headerCount:1,
        axis:[{position:"BOTTOM_AXIS",title:"Sana"},{position:"LEFT_AXIS",title:"Javoblar"},{position:"RIGHT_AXIS",title:"Aniqlik %"}],
        domains:[{domain:{sourceRange:{sources:[{sheetId:0,startRowIndex:0,endRowIndex:400,startColumnIndex:0,endColumnIndex:1}]}}}],
        series:[{series:{sourceRange:{sources:[{sheetId:0,startRowIndex:0,endRowIndex:400,startColumnIndex:1,endColumnIndex:2}]}},targetAxis:"LEFT_AXIS",type:"COLUMN"},
                {series:{sourceRange:{sources:[{sheetId:0,startRowIndex:0,endRowIndex:400,startColumnIndex:3,endColumnIndex:4}]}},targetAxis:"RIGHT_AXIS",type:"LINE"}]}}}}}
  ]})});
  scheduleSync();
}
let sheetBusy=false;
async function writeSheet(force){
  const id=sheetId(); if(!id || sheetBusy) return;
  if(!force && Date.now()-LS.get("sheetAt",0) < 3*MIN && !sheetQ.length) return;
  if(!tokenOk() || !LS.get("scopeFile",false)) { if(force) ensureFileScope(); return; }
  sheetBusy=true;
  try{
    const q=sheetQ.slice();
    if(q.length) await sfetch(`${SHEETS}/${id}/values/${encodeURIComponent("Javoblar!A:F")}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {method:"POST", body:JSON.stringify({values:q})});
    sheetQ=sheetQ.slice(q.length); await idb.set("sheetQ", sheetQ);
    const days=mergedDays(), dk=Object.keys(days).sort();
    const daily=dk.map(k=>{ const d=days[k], [n,ok]=sumDay(d), g=x=>d[x]?d[x][0]:0;
      return [k, n, ok, n?Math.round(ok/n*100):"", g("w"), g("wp"), g("g")+g("gp"), g("n"), d.new||0]; });
    const fmt = t => t ? new Date(t).toISOString().slice(0,10) : "";
    const words=[...cards].sort((a,b)=>(a.created||0)-(b.created||0)).map(c=>[c.ko,c.roman||"",c.uz||"",c.en||"",folderName(c.folder),STAGE_UZ[stageOf(c)],Math.round((c.interval||0)*10)/10,c.reps||0,c.lapses||0,fmt(c.due),fmt(c.created)]);
    const gr=[...grams].sort((a,b)=>(a.created||0)-(b.created||0)).map(g=>[g.title,g.name_uz||"",g.level||"",STAGE_UZ[stageOf(g)],g.reps||0,g.lapses||0,fmt(g.due)]);
    await sfetch(`${SHEETS}/${id}/values:batchClear`, {method:"POST", body:JSON.stringify({ranges:["Kunlik!A2:I","So'zlar!A2:K","Grammatika!A2:G"]})});
    await sfetch(`${SHEETS}/${id}/values:batchUpdate`, {method:"POST", body:JSON.stringify({valueInputOption:"RAW", data:[
      {range:"Kunlik!A2", values:daily.length?daily:[[""]]}, {range:"So'zlar!A2", values:words.length?words:[[""]]}, {range:"Grammatika!A2", values:gr.length?gr:[[""]]}]})});
    LS.set("sheetAt", Date.now());
  }catch(e){
    if(e && e.status===404){ LS.set("sheetId",""); LS.set("sheetMod",Date.now()); }   // jadval o'chirib yuborilgan
    if(force) throw e;
  }finally{ sheetBusy=false; }
}
$("#statsBtn").onclick = openStats;

/* ================= ilova (PWA) ================= */
let deferredInstall = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredInstall = e;
  if(!LS.get("installDismissed", false) && !isStandalone()) $("#installBar").classList.remove("hidden");
});
window.addEventListener("appinstalled", () => { deferredInstall = null; $("#installBar").classList.add("hidden"); });
async function doInstall(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  try{ await deferredInstall.userChoice; }catch(e){}
  deferredInstall = null; $("#installBar").classList.add("hidden");
}
$("#installBtn").onclick = doInstall;
$("#installX").onclick = () => { LS.set("installDismissed", true); $("#installBar").classList.add("hidden"); };
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

/* ================= tabs & init ================= */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["add","review","practice","library","grammar","numbers"].forEach(t=>$("#tab-"+t).classList.toggle("hidden",t!==tab));
  $("#folders").classList.toggle("hidden", tab==="numbers" || tab==="grammar");
  if(tab!=="grammar"){ gSession=null; gPr=null; gOpen=null; }
  if(tab!=="numbers"){ nl=null; numView="home"; }
  if(tab!=="practice") pr=null;
  renderAll();
});
function renderAll(){
  renderFolders();
  if(tab==="review" && (!session || !session.flipped)) renderReview();
  if(tab==="practice" && !pr) renderPractice();
  if(tab==="library") renderLibrary();
  if(tab==="numbers" && !nl) renderNumbers();
  if(tab==="grammar" && !gSession && !gPr && !gOpen && !document.activeElement.closest?.("#tab-grammar")) renderGrammar();
  updGBadge();
}
async function init(){
  try{
    cards = (await idb.all()) || [];
    grams = (await idb.gAll()) || [];
    await loadStats();
    folders = (await idb.get("folders")) || [];
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){ notice("Brauzer xotirasiga ulanib bo'lmadi. Maxfiy (incognito) rejimda bo'lsangiz, oddiy oynada oching."); }
  renderAll();
  bootGoogle();
  if(!settings.key) notice(`Boshlash uchun bepul Gemini kalitini kiriting: <a href="#" id="nk" style="color:inherit;font-weight:800">⚙️ Sozlamalarni ochish</a>`), $("#nk") && ($("#nk").onclick=e=>{e.preventDefault();openSettings();});
}
init();
})();
</script>
